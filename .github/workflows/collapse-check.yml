# The standing collapse check (docs/engine-v2/landscape-analysis.md §4): five tests per variant and per β, printed as
# one table per variant and "collapse check: N failures". It reports and never gates: it runs nightly and on demand
# only (never on pull requests or pushes), the script always exits 0, and the job is continue-on-error, so it can never
# block a merge. Read the result in the run's summary.
name: Collapse check

on:
  schedule:
    - cron: '17 3 * * *'   # nightly, 03:17 UTC
  workflow_dispatch:
    inputs:
      args:
        description: Extra arguments (for example --variant line-z --tests 1,2,3 --beta 0.05)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  collapse-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the collapse check
        env:
          ARGS: ${{ inputs.args }}
        run: |
          # shellcheck disable=SC2086
          pnpm --filter @workspace/v2-agents collapse-check $ARGS | tee collapse-check.md
          cat collapse-check.md >> "$GITHUB_STEP_SUMMARY"
