<!doctype html>
<!--
  Replit login relay. Replit's OIDC only returns to the client Repl's own domains, so the engine Repl serves
  this page at the URL set as REPLIT_OIDC_REDIRECT_URI (e.g. https://code-gods-engine.replit.app/convex-callback).
  It forwards `code` and `state` to the Convex engine unchanged; the engine checks state, nonce and PKCE
  against the flow cookie that only the browser that started the login holds. Set ENGINE_SITE below.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in…</title>
  <script>
    const ENGINE_SITE = "https://original-bear-509.ap-southeast-2.convex.site";
    location.replace(`${ENGINE_SITE}/api/callback${location.search}`);
  </script>
</head>
<body>
  <noscript>Signing in to Code Gods needs JavaScript.</noscript>
  <p>Signing in…</p>
</body>
</html>
