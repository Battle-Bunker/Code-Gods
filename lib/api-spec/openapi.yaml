openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      responses:
        "200":
          description: Current browser identity
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/AuthUser"
                      - { type: "null" }
  /ai-agents:
    get:
      operationId: listPublicAiAgents
      responses:
        "200":
          description: Authenticated public agent catalog, without prompts
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/PublicAiAgent" }
        "401": { description: "Authentication required" }
  /admin/ai-agents:
    get:
      operationId: listAdminAiAgents
      responses:
        "200":
          description: Editable agents and model catalog
          content:
            application/json:
              schema:
                type: object
                required: [agents, models]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/AiAgent" }
                  models:
                    type: array
                    items: { $ref: "#/components/schemas/AiAgentModel" }
        "401": { description: "Authentication required" }
        "403": { description: "Verified allowlisted browser identity required" }
    post:
      operationId: createAdminAiAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentInput" }
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgent" }
        "400": { description: "Invalid input" }
        "401": { description: "Authentication required" }
        "403": { description: "Verified allowlisted browser identity required" }
  /admin/ai-agents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateAdminAiAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentUpdate" }
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgent" }
        "400": { description: "Invalid input" }
        "401": { description: "Authentication required" }
        "403": { description: "Verified allowlisted browser identity required" }
        "404": { description: "Agent not found" }
        "409": { description: "Revision conflict" }
    delete:
      operationId: deleteAdminAiAgent
      parameters:
        - { name: revision, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: "Deleted agent" }
        "400": { description: "Invalid revision" }
        "401": { description: "Authentication required" }
        "403": { description: "Verified allowlisted browser identity required" }
        "404": { description: "Agent not found" }
        "409": { description: "Revision conflict" }
  /rooms:
    get:
      operationId: listRooms
      responses:
        "200":
          description: Rooms you have joined
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoomSummary" }
    post:
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomInput" }
      responses:
        "201":
          description: Created room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
  /games/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: "Game short code or UUID" }
    get:
      operationId: getGameLink
      responses:
        "200":
          description: Canonical game link and whether the room still displays this game
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameLink" }
        "401": { description: "Authentication required" }
        "403": { description: "Player token belongs to another room" }
        "404": { description: "Game not found or identifier is ambiguous" }
  /rooms/{roomId}:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRoom
      responses:
        "200":
          description: Public room state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
  /rooms/{roomId}/games:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listRoomGames
      responses:
        "200":
          description: Finished games played in this room, newest first. Public results only.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GameRecord" }
        "401": { description: "Authentication required" }
        "403": { description: "Player token belongs to another room" }
  /games/{code}/state:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: "Game short code or UUID" }
    get:
      operationId: getGameState
      responses:
        "200":
          description: One game's public state, live while it runs and final once it has ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "401": { description: "Authentication required" }
        "403": { description: "Player token belongs to another room" }
        "404": { description: "Game not found or identifier is ambiguous" }
  /rooms/{roomId}/actions:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
    post:
      operationId: roomAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomActionInput" }
      responses:
        "200":
          description: Updated public room state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
  /device/request:
    post:
      operationId: requestDevice
      summary: Request room-bound delegated player authorization
      description: Public S256 PKCE initiation. Labels are self-reported, not verified workspace or model identities. Permission defaults to act for existing clients.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRequestInput" }
      responses:
        "200":
          description: Five-minute human approval request; keep deviceSecret and verifier private
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRequestResult" }
        "400": { description: "Invalid room, label, permission or challenge" }
        "404": { description: "Room not found or alias ambiguous" }
        "429": { description: "Too many device requests" }
        "503": { description: "Authority idle; a human must wake it" }
  /device/details:
    get:
      operationId: getDeviceDetails
      description: Signed-in browser room members only. Once decided, only the deciding user may read the request.
      security: [{ browserSession: [] }]
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Server-resolved room and self-reported requester label for explicit consent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDetails" }
        "401": { description: "Browser login required" }
        "403": { description: "Not a room member or request belongs to another user" }
        "404": { description: "Unknown code" }
  /device/approve:
    post:
      operationId: approveDevice
      description: Explicit browser-only approval as an existing member of the requested room. Cookie requests require a same-origin Origin header.
      security: [{ browserSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceApprovalInput" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResult" }
        "400": { description: "Invalid, decided or expired code" }
        "401": { description: "Browser login required" }
        "403": { description: "Browser identity and room membership required" }
        "409": { description: "Request already decided concurrently" }
        "503": { description: "Authority idle" }
  /device/deny:
    post:
      operationId: denyDevice
      description: Browser-only denial by an existing room member. Cookie requests require a same-origin Origin header.
      security: [{ browserSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceApprovalInput" }
      responses:
        "200":
          description: Denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResult" }
        "400": { description: "Invalid, decided or expired code" }
        "401": { description: "Browser login required" }
        "403": { description: "Browser identity and room membership required" }
        "409": { description: "Request already decided concurrently" }
  /device/poll:
    post:
      operationId: pollDevice
      description: Public secret-and-verifier proof. Redemption is single-use and atomically issues a fifteen-minute opaque room-bound player bearer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceProofInput" }
      responses:
        "200":
          description: Approved and redeemed; keep token private
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCredential" }
        "202":
          description: Awaiting explicit human approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePendingResult" }
        "400":
          description: Denied, expired, cancelled, invalid proof or already redeemed; malformed requests may return an error instead of status
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/DeviceEndedResult" }
                  - { $ref: "#/components/schemas/ErrorResult" }
        "429": { description: "Too many device requests" }
  /device/cancel:
    post:
      operationId: cancelDevice
      description: Public secret-and-verifier cancellation. Also revokes the session if this request was already redeemed. Remains reachable when idle.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceProofInput" }
      responses:
        "200":
          description: Cancelled, with any corresponding live session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResult" }
        "400": { description: "Invalid proof or already cancelled request" }
        "429": { description: "Too many device requests" }
  /device/grants:
    get:
      operationId: listDeviceGrants
      description: List only the signed-in browser user's unexpired delegated sessions.
      security: [{ browserSession: [] }]
      responses:
        "200":
          description: Active grants belonging to this human, never bearer credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGrantList" }
        "401": { description: "Browser login required" }
        "403": { description: "Browser identity required" }
  /device/grants/{delegateId}/revoke:
    parameters:
      - { name: delegateId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: revokeDeviceGrant
      description: Owner-only browser revocation. Closes this delegate's passive sockets promptly without revoking unrelated browser sessions. Cookie requests require a same-origin Origin header.
      security: [{ browserSession: [] }]
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResult" }
        "401": { description: "Browser login required" }
        "403": { description: "Browser identity required" }
        "404": { description: "Grant absent or owned by another user" }
  /device/revoke:
    post:
      operationId: revokeDevice
      description: Revoke the authenticated player bearer itself, including read-only sessions. Does not accept browser-cookie identity and remains reachable when idle.
      security: [{ playerBearer: [] }]
      responses:
        "200":
          description: Revoked and corresponding sockets invalidated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResult" }
        "401": { description: "Valid player bearer required" }
        "403": { description: "Browser identity cannot be revoked through this endpoint" }
  /manifest:
    get:
      operationId: getManifest
      responses:
        "200":
          description: Protocol and runtime capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifest" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /player/v1/rooms/{roomId}/observation:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getPlayerObservation
      description: >-
        Player protocol v3 observation (lib/player-client/src/protocol.ts is the normative schema): your own
        scores and peer aggregates, your agents, the instance and your kid card. Browser session or room-scoped bearer.
      responses:
        "200":
          description: Personal observation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerObservation" }
        "403": { description: "Not a member of this room, or a credential for another room" }
  /player/v1/rooms/{roomId}/commands:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
    post:
      operationId: sendPlayerCommand
      description: Idempotent per (god, commandId). Validation is free; summon pays the source's description bits; destroy is free and owner-only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerEnvelope" }
      responses:
        "200":
          description: Command receipt (accepted or rejected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerCommandResult" }
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: cg_session
      description: Human browser session issued by Replit OIDC; delegated player sessions cannot approve, deny or manage grants.
    playerBearer:
      type: http
      scheme: bearer
      description: Opaque room-bound fifteen-minute player credential; never a host or admin identity.
  schemas:
    AuthUser:
      type: object
      required: [id, name, isAdmin]
      properties:
        id: { type: string }
        name: { type: string }
        isAdmin: { type: boolean }
    PublicAiAgent:
      type: object
      required: [id, name, provider, model]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string, enum: [anthropic, openai] }
        model: { type: string }
    AiAgent:
      allOf:
        - $ref: "#/components/schemas/PublicAiAgent"
        - type: object
          required: [prompt, revision, createdAt, updatedAt]
          properties:
            prompt: { type: string, maxLength: 10000 }
            revision: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AiAgentInput:
      type: object
      additionalProperties: false
      required: [name, provider, model, prompt]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        provider: { type: string, enum: [anthropic, openai] }
        model: { type: string }
        prompt: { type: string, maxLength: 10000 }
    AiAgentUpdate:
      type: object
      additionalProperties: false
      required: [name, provider, model, prompt, revision]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        provider: { type: string, enum: [anthropic, openai] }
        model: { type: string }
        prompt: { type: string, maxLength: 10000 }
        revision: { type: integer, minimum: 1 }
    AiAgentModel:
      type: object
      required: [id, label, provider, configured, inputUsdPerMillion, outputUsdPerMillion]
      properties:
        id: { type: string }
        label: { type: string }
        provider: { type: string, enum: [anthropic, openai] }
        configured: { type: boolean }
        inputUsdPerMillion: { type: number }
        outputUsdPerMillion: { type: number }
    StatusResult:
      type: object
      required: [status]
      properties:
        status: { type: string }
    DeviceApprovalInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 4, maxLength: 32 }
    DevicePermission:
      type: string
      enum: [read, act, owner]
      description: read permits personal observations; act additionally permits player commands. owner requires explicit approval by the room owner and includes room configuration, AI budget and seats, game lifecycle and player commands, but never global administration or access to another room.
    DeviceRequestInput:
      type: object
      required: [roomId, challenge]
      properties:
        roomId: { type: string, description: "Canonical room UUID or authority-resolved room alias" }
        challenge: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: "Base64url S256 digest of the private verifier" }
        clientLabel: { type: string, minLength: 1, maxLength: 120, default: "Room assistant", description: "Self-reported printable label; not verified workspace or model identity" }
        permission:
          allOf: [{ $ref: "#/components/schemas/DevicePermission" }]
          default: act
    DeviceRequestResult:
      type: object
      required: [deviceId, delegateId, deviceSecret, roomId, userCode, verificationPath, expiresIn, interval, permission]
      properties:
        deviceId: { type: string, format: uuid }
        delegateId: { type: string, format: uuid, description: "Unique generated delegated request/session identifier; equals deviceId" }
        deviceSecret: { type: string, description: "Private proof material; never display in chat or logs" }
        roomId: { type: string, format: uuid }
        userCode: { type: string }
        verificationPath: { type: string }
        expiresIn: { type: integer, enum: [300] }
        interval: { type: integer, enum: [2] }
        permission: { $ref: "#/components/schemas/DevicePermission" }
    DeviceProofInput:
      type: object
      required: [deviceId, deviceSecret, verifier]
      properties:
        deviceId: { type: string, minLength: 1, maxLength: 256 }
        deviceSecret: { type: string, minLength: 1, maxLength: 256 }
        verifier: { type: string, minLength: 1, maxLength: 256, description: "Private verifier whose S256 digest matches the request challenge" }
    DeviceCredential:
      type: object
      required: [token, expiresIn, roomId, godId, delegateId, permission]
      properties:
        token: { type: string, description: "Private opaque bearer; do not display or persist to assistant output" }
        expiresIn: { type: integer, enum: [900] }
        roomId: { type: string, format: uuid }
        godId: { type: string }
        delegateId: { type: string, format: uuid }
        permission: { $ref: "#/components/schemas/DevicePermission" }
    DevicePendingResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending] }
    DeviceEndedResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [denied, expired] }
    ErrorResult:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
    DeviceDetails:
      type: object
      required: [roomId, roomCode, clientLabel, permission, expiresAt, status]
      properties:
        roomId: { type: string, format: uuid }
        roomCode: { type: string }
        clientLabel: { type: string, description: "Self-reported, not verified requester identity" }
        permission: { $ref: "#/components/schemas/DevicePermission" }
        canApprove: { type: boolean, description: "Whether the signed-in human may approve this request. Owner grants require the current room owner." }
        expiresAt: { type: string, format: date-time, description: "Approval-request deadline, not a redeemed grant's lifetime" }
        status: { type: string, enum: [pending, approved, denied, redeemed, expired] }
    DeviceGrant:
      type: object
      required: [delegateId, roomId, clientLabel, permission, expiresAt]
      properties:
        delegateId: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        clientLabel: { type: string, description: "Self-reported, not verified requester identity" }
        permission: { $ref: "#/components/schemas/DevicePermission" }
        expiresAt: { type: string, format: date-time, description: "Persisted player-session expiry" }
    DeviceGrantList:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items: { $ref: "#/components/schemas/DeviceGrant" }
    AuthoredOption:
      type: object
      required: [id, label, languages, objectTypes]
      properties:
        id: { type: string }
        label: { type: string }
        languages:
          type: array
          items: { type: string }
        objectTypes:
          type: array
          items: { type: string }
    SettingsOptions:
      type: object
      required: [grammarId, utilitySelectorId, complexityFunctionId]
      properties:
        grammarId:
          type: array
          items: { $ref: "#/components/schemas/AuthoredOption" }
        utilitySelectorId:
          type: array
          items: { $ref: "#/components/schemas/AuthoredOption" }
        complexityFunctionId:
          type: array
          items: { $ref: "#/components/schemas/AuthoredOption" }
    Manifest:
      type: object
      required: [protocolVersion, playerProtocol, defaults, runtimes, minimumPlayers, options, aiFunding, objectTypes, presets, priors]
      properties:
        protocolVersion: { type: integer }
        playerProtocol: { type: string, description: "Player protocol version accepted at /player/v1 (code-gods.player.v3)." }
        minimumPlayers: { type: integer }
        defaults: { $ref: "#/components/schemas/Settings" }
        options: { $ref: "#/components/schemas/SettingsOptions" }
        aiFunding: { $ref: "#/components/schemas/AIFunding" }
        runtimes:
          type: array
          items: { type: string }
        objectTypes:
          description: Object types for the settings pickers. Settings may choose only an instantiation listed in `offered`.
          type: array
          items: { $ref: "#/components/schemas/ObjectTypeInfo" }
        priors: { type: array, items: { type: string }, description: "Rarity priors the calibration tables know." }
        presets:
          description: Named starting points, in display order.
          type: array
          items: { $ref: "#/components/schemas/SettingsPreset" }
    SettingsPreset:
      type: object
      required: [id, label, kid, objectType, typeArgs, settings, offered]
      properties:
        id: { type: string }
        label: { type: string }
        kid: { type: string }
        objectType: { type: string }
        typeArgs: { $ref: "#/components/schemas/TypeArgs" }
        settings: { $ref: "#/components/schemas/Settings" }
        offered: { type: boolean, description: Whether its instantiation is currently offered. }
    Badge:
      type: object
      description: A capability in kid-friendly words, e.g. 🔟 Place value or ♠ Suits.
      required: [id, emoji, label, kid]
      properties:
        id: { type: string }
        emoji: { type: string }
        label: { type: string }
        kid: { type: string }
    TypeArgs:
      type: object
      description: Arguments of the object type constructor, e.g. Int {min, max}, string {maxLength}, Grid {size, symbols, colours}.
      additionalProperties:
        oneOf:
          - { type: number }
          - { type: string }
    ComponentOption:
      type: object
      required: [id, label, emoji, kid]
      properties:
        id: { type: string }
        label: { type: string }
        emoji: { type: string }
        kid: { type: string }
    ParamSchema:
      type: object
      description: One type parameter. `component` picks one of `options`; `int` is a number in [min, max], with the calibrated `presets`.
      required: [kind, id, label]
      properties:
        kind: { type: string, enum: [component, int] }
        id: { type: string }
        label: { type: string }
        slot: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/ComponentOption" } }
        min: { type: integer }
        max: { type: integer }
        presets: { type: array, items: { type: integer } }
    CapabilityClass:
      type: object
      required: [id, slot, superclasses, badge]
      properties:
        id: { type: string }
        slot: { type: string }
        superclasses: { type: array, items: { type: string } }
        badge: { $ref: "#/components/schemas/Badge" }
    OfferedInstantiation:
      type: object
      description: An instantiation the server offers (every utility function dealable in it has a calibration table).
      required: [key, args, label, badges, classes, settingsDefaults]
      properties:
        key: { type: string, description: "Canonical key, e.g. Grid(5,base10,rgby)." }
        args: { $ref: "#/components/schemas/TypeArgs" }
        label: { type: string }
        badges: { type: array, items: { $ref: "#/components/schemas/Badge" } }
        classes: { type: array, items: { type: string } }
        settingsDefaults: { $ref: "#/components/schemas/SettingsDefaults" }
    SettingsDefaults:
      type: object
      description: "Tuned settings for this type or instantiation (e.g. Grid: startingObjectCount 80, spawnRateHz 0.5). The server applies them when the owner switches to it, unless the request changes those fields."
      additionalProperties:
        oneOf:
          - { type: number }
          - { type: string }
    ObjectTypeInfo:
      type: object
      required: [id, label, emoji, kid, params, defaults, settingsDefaults, classes, offered]
      properties:
        id: { type: string, description: "Int, string or Grid." }
        label: { type: string }
        emoji: { type: string }
        kid: { type: string }
        params: { type: array, items: { $ref: "#/components/schemas/ParamSchema" } }
        defaults: { $ref: "#/components/schemas/TypeArgs" }
        settingsDefaults: { $ref: "#/components/schemas/SettingsDefaults" }
        classes: { type: array, items: { $ref: "#/components/schemas/CapabilityClass" } }
        offered: { type: array, items: { $ref: "#/components/schemas/OfferedInstantiation" } }
    HelperDoc:
      type: object
      required: [name, signature, kid, group]
      properties:
        name:
          type: object
          required: [python, typescript]
          properties: { python: { type: string }, typescript: { type: string } }
        signature:
          type: object
          required: [python, typescript]
          properties: { python: { type: string }, typescript: { type: string } }
        kid: { type: string }
        class: { type: string }
        group: { type: string, enum: [read, mutator] }
    MutatorSummary:
      type: object
      required: [id, name, emoji, summary]
      properties:
        id: { type: string }
        name: { type: string }
        emoji: { type: string }
        summary: { type: string }
    InstanceInfo:
      type: object
      description: A fully applied object type (e.g. Grid(5,base10,rgby)), its display tables, mutators and prelude helpers.
      required: [objectType, args, key, label, badges, terms, display, codec, mutators, helpers]
      properties:
        objectType: { type: string }
        args: { $ref: "#/components/schemas/TypeArgs" }
        key: { type: string }
        label: { type: string }
        badges: { type: array, items: { $ref: "#/components/schemas/Badge" } }
        terms: { type: object, additionalProperties: { type: number } }
        display: { type: object, additionalProperties: true, description: "Type-specific display tables (Grid: symbols and colours)." }
        codec:
          type: object
          required: [format, maxLength]
          properties: { format: { type: string }, maxLength: { type: integer } }
        mutators: { type: array, items: { $ref: "#/components/schemas/MutatorSummary" } }
        helpers: { type: array, items: { $ref: "#/components/schemas/HelperDoc" } }
    AIFunding:
      type: object
      required: [provider, model, billing, inputUsdPerMillion, outputUsdPerMillion, configured, live]
      properties:
        provider: { type: string, enum: [anthropic] }
        model: { type: string }
        billing: { type: string, enum: [direct] }
        inputUsdPerMillion: { type: number }
        outputUsdPerMillion: { type: number }
        configured: { type: boolean }
        live: { type: boolean }
    RoomInput:
      type: object
      additionalProperties: false
      properties: {}
    RoomActionInput:
      type: object
      required: [action, requestId]
      properties:
        action:
          type: string
          enum: [join, leave, ready, settings, start, endGame, addAi, removeAi, chat, resume]
          description: >-
            Settings and seats describe the NEXT game and can change only while no game is active.
            `leave` is refused for the owner and for a member seated in the active game.
            `endGame` (owner) ends the active game early and records its result.
        requestId: { type: string }
        revision: { type: integer }
        settings: { $ref: "#/components/schemas/Settings" }
        ready: { type: boolean }
        text: { type: string, maxLength: 4000 }
        deityId: { type: string }
        aiBudget: { type: integer, minimum: 0, maximum: 1000000 }
        aiAgentId: { type: string }
        preset: { type: string, description: "settings only: apply a Manifest.presets entry instead of `settings` (keeps the room's language unless settings.language is sent)." }
    Settings:
      type: object
      required: [language, objectType, typeArgs, grammarId, utilitySelectorId, complexityFunctionId, spawnFunctionId, planningSeconds, halfLifeSeconds, startingObjectCount, spawnRateHz, interactionRateHz, interactionComputeMs, pauseSeconds, startingEnergy, energyPerSecond]
      properties:
        language: { type: string, enum: [python, typescript] }
        objectType: { type: string, enum: [Int, string, Grid], description: "The object type constructor." }
        typeArgs:
          description: Its arguments. Only instantiations listed in Manifest.objectTypes[].offered are accepted.
          allOf: [{ $ref: "#/components/schemas/TypeArgs" }]
        grammarId: { type: string, enum: [python-agent-v1, typescript-agent-v1] }
        utilitySelectorId: { type: string, default: fair-aligned, description: "fair-aligned (default) or divine-lottery." }
        complexityFunctionId:
          type: string
          enum: [ast-bits-v1, ts-ast-bits-v1-uniform]
          description: "The summon price: ast-bits-v1 (Python) or ts-ast-bits-v1-uniform (TypeScript). One per language."
        spawnFunctionId: { type: string, enum: [uniform] }
        planningSeconds: { type: number }
        halfLifeSeconds: { type: number }
        startingObjectCount: { type: integer }
        spawnRateHz: { type: number }
        interactionRateHz: { type: number, minimum: 0, maximum: 1000, default: 100 }
        interactionComputeMs:
          description: CPU backstop per act in milliseconds (excludes compilation and worker startup). The deterministic stepBudget is what binds.
          type: integer
          minimum: 1
          maximum: 1000
          default: 1000
        stepBudget: { type: integer, minimum: 1, maximum: 10000000, default: 500000, description: "Deterministic step budget per act." }
        perActFloorBits: { type: number, minimum: 0, default: 0, description: "Bits added to every act's charge, valid or not." }
        priorId: { type: string, default: uniform, description: "The rarity prior (Manifest.priors); uniform for now." }
        pauseSeconds: { type: number }
        startingEnergy: { type: number, description: "God energy (bits) at the start; pays summon prices." }
        energyPerSecond: { type: number, description: "God income, bits per real-time second." }
        agentEnergyPerSecond: { type: number, minimum: 0, maximum: 1000, default: 2, description: "Each agent's income, bits per second of world time." }
        agentBatteryActs: { type: number, minimum: 1, maximum: 1000, default: 2, description: "An agent's energy is capped at this many expected acts." }
        maxAgentsPerGod: { type: integer, minimum: 1, maximum: 200, default: 200 }
        penaltyWeight: { type: number, minimum: 0, default: 1, description: "w in n = s⁺ − w(h − E h): the weight of a defence-goal bit." }
        defenceRate: { type: number, minimum: 0, maximum: 1, default: 0, description: "Probability that a god is also dealt a defence goal." }
        excludedFamilies:
          description: Utility families never dealt in this game (ids from the catalog of this object type).
          type: array
          maxItems: 200
          default: []
          items: { type: string }
    RoomSummary:
      type: object
      required: [id, shortCode, ownerId, ownerName, createdAt, memberCount, phase, activeGameShortCode]
      properties:
        id: { type: string }
        shortCode: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        createdAt:
          description: Unix milliseconds; null when the creation time is unknown.
          oneOf:
            - { type: number }
            - { type: "null" }
        memberCount: { type: integer }
        phase:
          type: string
          description: "`lobby` between games, otherwise the active game's phase."
        activeGameShortCode: { type: [string, "null"] }
    Member:
      type: object
      required: [id, name, kind, ready]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [human, ai] }
        ready: { type: boolean }
        status: { type: string }
    ChatMessage:
      type: object
      required: [id, authorId, authorName, kind, text, timestamp]
      properties:
        id: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        kind: { type: string }
        text: { type: string }
        timestamp: { type: number }
    PublicObject:
      type: object
      required: [id, value, version, salience]
      properties:
        id: { type: string }
        value:
          oneOf:
            - { type: integer }
            - { type: string }
        version: { type: integer }
        salience:
          type: number
          description: Σ over gods of their net bits for this object. Individual scores are never public.
    Standing:
      type: object
      required: [deityId, name, kind, totalPayoff, rank]
      properties:
        deityId: { type: string }
        name: { type: string }
        kind: { type: string }
        totalPayoff: { type: number, description: "Σ over live objects of n_i · max(0, Σ_{j≠i} n_j), in bits²." }
        rank: { type: integer }
    GodScore:
      type: object
      description: One god's own score of one object (private to that god).
      required: [ordinal, rewardBits, netBits]
      properties:
        ordinal:
          description: The utility function's value, a number or a tuple compared lexicographically.
          oneOf:
            - { type: number }
            - { type: array, items: { type: number } }
        rewardBits: { type: number, description: "✨ surprisal of the ordinal under the spawn prior." }
        penaltyBits: { type: number, description: "⚠️ defence-goal penalty bits (only with a defence goal)." }
        netBits: { type: number }
    PersonalObject:
      type: object
      description: An object as one god sees it. peerNetBits and peerCare are aggregates over all other gods.
      required: [id, value, version, salience, own, peerNetBits, peerCare, payoff]
      properties:
        id: { type: string }
        value:
          oneOf:
            - { type: integer }
            - { type: string }
        version: { type: integer }
        salience: { type: number }
        own: { $ref: "#/components/schemas/GodScore" }
        peerNetBits: { type: number }
        peerCare: { type: number, description: "max(0, peerNetBits)." }
        payoff: { type: number, description: "own.netBits × peerCare." }
    CostBreakdown:
      type: object
      description: Expected bits per act, by term.
      required: [decision, erasure, motion, floor]
      properties:
        decision: { type: number, description: "Measured decision information I(X; A), charged on every act." }
        erasure: { type: number }
        motion: { type: number }
        floor: { type: number }
    SummonParts:
      type: object
      required: [structure, names, literals, moveFlags, literalMoves]
      properties:
        structure: { type: number }
        names: { type: number }
        literals: { type: number }
        moveFlags: { type: number }
        literalMoves: { type: number }
    AgentInfo:
      type: object
      description: One of your own agents. It acts only while eligible (energy ≥ expectedActCost); negative energy is a cooldown.
      required: [id, source, createdAt, summonCost, decisionBits, expectedActCost, breakdown, randomized, energy, eligible, acts, spent]
      properties:
        id: { type: string }
        source: { type: string }
        createdAt: { type: number }
        summonCost: { type: number, description: "Description bits paid once from god energy (ast-bits-v1 / ts-ast-bits-v1-uniform)." }
        decisionBits: { type: number, description: "Measured decision information, charged on every act." }
        expectedActCost: { type: number, description: "Expected charge per act over the season's reference mixture." }
        breakdown: { $ref: "#/components/schemas/CostBreakdown" }
        randomized: { type: boolean, description: "The agent uses random (measured over several seeds)." }
        energy: { type: number }
        eligible: { type: boolean }
        acts: { type: integer }
        spent: { type: number }
    UtilityCardPenalty:
      type: object
      required: [familyId, emoji, name, summary, comparative, source]
      properties:
        familyId: { type: string }
        emoji: { type: string }
        name: { type: string }
        summary: { type: string }
        comparative: { type: string, description: "The ⚠️ line reads '⚠️ <comparative> than 90% of objects'." }
        source: { type: string, description: "Defines penalty(x): bigger is worse." }
    UtilityCard:
      type: object
      description: A god's own kid card, with an optional defence goal.
      required: [familyId, emoji, name, theme, summary, language, source]
      properties:
        familyId: { type: string }
        emoji: { type: string }
        name: { type: string }
        theme: { type: string }
        summary: { type: string }
        language: { type: string, enum: [python, typescript] }
        source: { type: string }
        penalty: { $ref: "#/components/schemas/UtilityCardPenalty" }
    GameLink:
      type: object
      required: [id, shortCode, roomShortCode, status]
      properties:
        id: { type: string }
        shortCode: { type: string }
        roomShortCode: { type: [string, "null"] }
        status: { type: string, enum: [current, historical, unavailable] }
    RosterEntry:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [human, ai] }
    Winner:
      type: object
      required: [deityId, name, kind]
      properties:
        deityId: { type: string }
        name: { type: string }
        kind: { type: string }
    ActiveGameRef:
      type: object
      description: The room's single active (not yet ended) game.
      required: [id, shortCode, phase, startedAt, roster]
      properties:
        id: { type: string }
        shortCode: { type: string }
        phase: { type: string }
        startedAt: { type: number }
        roster: { type: array, items: { $ref: "#/components/schemas/RosterEntry" } }
    GameRecord:
      type: object
      description: Public result of one finished game, kept in its room's history.
      required: [id, shortCode, roomId, startedAt, endedAt, endReason, settings, roster, leaderboard, winners, worldSeconds, objectCount, agentCount, scoring, seasonCommitment]
      properties:
        id: { type: string }
        shortCode: { type: string }
        roomId: { type: string }
        startedAt: { type: number }
        endedAt:
          description: Unix milliseconds.
          type: [number, "null"]
        endReason:
          type: [string, "null"]
          enum: [lifetime, owner, null]
        settings: { $ref: "#/components/schemas/Settings" }
        roster: { type: array, items: { $ref: "#/components/schemas/RosterEntry" } }
        leaderboard: { type: array, items: { $ref: "#/components/schemas/Standing" } }
        winners:
          description: Every god ranked first (ties share the win).
          type: array
          items: { $ref: "#/components/schemas/Winner" }
        worldSeconds: { type: number }
        objectCount: { type: integer }
        agentCount: { type: integer }
        scoring:
          type: string
          enum: [information-v1]
          description: "Information scoring: payoffs in bits²."
        seasonCommitment: { type: string, description: "sha256 (hex) of the season salt behind this game's seeds; the salt is revealed after the season." }
    GameView:
      description: A game's own page. Public information only.
      allOf:
        - $ref: "#/components/schemas/PublicGame"
        - type: object
          required: [roomId, roomShortCode, ownerId, status, winners, chat, roomActiveGame, utilityCatalog, serverTime, startedAt, endedAt, endReason, recoveryReason, settings, roster]
          properties:
            roomId: { type: [string, "null"] }
            roomShortCode: { type: [string, "null"] }
            ownerId: { type: [string, "null"] }
            status: { type: string, enum: [active, ended] }
            winners: { type: array, items: { $ref: "#/components/schemas/Winner" } }
            chat:
              description: Public room chat sent while this game was played (most recent 100).
              type: array
              items: { $ref: "#/components/schemas/ChatMessage" }
            roomActiveGame:
              description: The room's active game now, which may be a newer one.
              oneOf:
                - { $ref: "#/components/schemas/ActiveGameRef" }
                - { type: "null" }
            utilityCatalog: { type: array, items: { $ref: "#/components/schemas/UtilityFamily" } }
            serverTime: { type: number }
    PublicGame:
      type: object
      required: [id, shortCode, phase, worldSeconds, planningEndsAt, pauseEndsAt, objects, leaderboard, agentCount, objectInstance]
      properties:
        id: { type: string }
        shortCode: { type: string }
        phase: { type: string }
        worldSeconds: { type: number }
        planningEndsAt: { type: number }
        pauseEndsAt: { type: number }
        agentCount: { type: integer }
        objects: { type: array, items: { $ref: "#/components/schemas/PublicObject" } }
        leaderboard: { type: array, items: { $ref: "#/components/schemas/Standing" } }
        startedAt: { type: number }
        endedAt: { type: [number, "null"] }
        endReason: { type: [string, "null"] }
        recoveryReason: { type: [string, "null"] }
        settings: { $ref: "#/components/schemas/Settings" }
        roster: { type: array, items: { $ref: "#/components/schemas/RosterEntry" } }
        objectInstance: { $ref: "#/components/schemas/InstanceInfo" }
    RoomState:
      type: object
      description: >-
        A room is a persistent lobby: members, readiness and the owner's settings for the NEXT game.
        Each launched game has its own page (GET /games/{code}/state) and, once ended, an entry in
        GET /rooms/{roomId}/games.
      required: [id, shortCode, ownerId, ownerName, createdAt, revision, settings, members, chat, activeGame, serverTime, objectInstance, utilityCatalog, aiBudget, aiUsed]
      properties:
        id: { type: string }
        shortCode: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        createdAt:
          description: Unix milliseconds; null when the creation time is unknown.
          type: [number, "null"]
        revision: { type: integer }
        settings:
          description: Settings for the next game. Each game keeps its own snapshot from launch.
          allOf: [{ $ref: "#/components/schemas/Settings" }]
        members: { type: array, items: { $ref: "#/components/schemas/Member" } }
        chat: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
        activeGame:
          oneOf:
            - { $ref: "#/components/schemas/ActiveGameRef" }
            - { type: "null" }
        serverTime: { type: number }
        objectInstance:
          description: The instantiation the next game will play.
          allOf: [{ $ref: "#/components/schemas/InstanceInfo" }]
        utilityCatalog:
          type: array
          description: Public list of utility-function families gods may draw for these settings, with availability.
          items: { $ref: "#/components/schemas/UtilityFamily" }
        aiBudget: { type: integer }
        aiUsed: { type: integer }
        aiInputTokens: { type: integer, description: "Provider-reported input tokens recorded for this game." }
        aiOutputTokens: { type: integer, description: "Provider-reported output tokens recorded for this game." }
    UtilityFamily:
      type: object
      description: A family any god might draw (never who drew what). Locked families say why, and the smallest settings change that unlocks them.
      required: [id, name, emoji, theme, role, tags, available, excluded, badges]
      properties:
        id: { type: string }
        name: { type: string }
        emoji: { type: string }
        theme: { type: string }
        role: { type: string, enum: [reward, penalty], description: "penalty families are dealt only as defence goals." }
        tags: { type: array, items: { type: string } }
        available: { type: boolean }
        excluded: { type: boolean, description: "Taken out of the lottery by settings.excludedFamilies." }
        badges: { type: array, items: { $ref: "#/components/schemas/Badge" } }
        locked:
          type: object
          required: [reason]
          properties:
            reason: { type: string, description: "Kid wording, e.g. needs ♠ Suits: pick Playing cards." }
            unlock: { $ref: "#/components/schemas/TypeArgs" }
    PlayerCommand:
      type: object
      description: "One of validate/summon {language, source}, ready {ready}, pause, chat {text}, destroy {agentId}."
      required: [type]
      properties:
        type: { type: string, enum: [validate, summon, ready, pause, chat, destroy] }
        language: { type: string, enum: [python, typescript] }
        source: { type: string, maxLength: 16384, description: "Defines agent(obj) returning mutator calls, e.g. def agent(x): return [add(1)]." }
        ready: { type: boolean }
        text: { type: string, maxLength: 2000 }
        agentId: { type: string, description: "destroy only. One of your own agents." }
    PlayerEnvelope:
      type: object
      required: [version, commandId, command]
      properties:
        version: { type: string, enum: [code-gods.player.v3] }
        commandId: { type: string, format: uuid }
        gameId: { type: string, description: "Required for validate, summon, pause and destroy." }
        command: { $ref: "#/components/schemas/PlayerCommand" }
    AgentValidation:
      type: object
      required: [valid, cost, expectedActCost, diagnostics]
      properties:
        valid: { type: boolean }
        cost: { type: number, description: "Summon price in bits." }
        parts: { $ref: "#/components/schemas/SummonParts" }
        decisionBits: { type: number }
        expectedActCost: { type: number, description: "Expected charge per act." }
        breakdown: { $ref: "#/components/schemas/CostBreakdown" }
        randomized: { type: boolean }
        diagnostics: { type: array, items: { type: string } }
    PlayerCommandResult:
      type: object
      required: [commandId, accepted, message]
      properties:
        commandId: { type: string }
        accepted: { type: boolean }
        message: { type: string }
        validation: { $ref: "#/components/schemas/AgentValidation" }
    PlayerObjectView:
      type: object
      required: [id, value, own, peerNetBits, peerCare, payoff]
      properties:
        id: { type: string }
        value:
          oneOf:
            - { type: integer }
            - { type: string }
        own: { $ref: "#/components/schemas/GodScore" }
        peerNetBits: { type: number }
        peerCare: { type: number }
        payoff: { type: number }
    PlayerAgentView:
      allOf:
        - $ref: "#/components/schemas/AgentInfo"
        - type: object
          required: [language]
          properties:
            language: { type: string, enum: [python, typescript] }
    PlayerObservation:
      type: object
      required: [version, roomId, revision, phase, language, self, objects, agents, transformations, leaderboard, chat]
      properties:
        version: { type: string, enum: [code-gods.player.v3] }
        roomId: { type: string }
        revision: { type: integer }
        gameId: { type: string }
        roomShortCode: { type: string }
        gameShortCode: { type: string }
        seated: { type: boolean }
        planningEndsAt: { type: number }
        pauseEndsAt: { type: number }
        phase: { type: string, enum: [lobby, planning, running, paused, ended] }
        language: { type: string, enum: [python, typescript] }
        instance: { $ref: "#/components/schemas/InstanceInfo" }
        economy:
          type: object
          required: [energyPerSecond, agentEnergyPerSecond, agentBatteryActs, maxAgentsPerGod, penaltyWeight, worldSeconds]
          properties:
            energyPerSecond: { type: number }
            agentEnergyPerSecond: { type: number }
            agentBatteryActs: { type: number }
            maxAgentsPerGod: { type: integer }
            penaltyWeight: { type: number }
            worldSeconds: { type: number }
        self:
          type: object
          required: [godId, label, isAI, energy, ready]
          properties:
            godId: { type: string }
            label: { type: string }
            isAI: { type: boolean }
            energy: { type: number }
            ready: { type: boolean }
            pauseUsed: { type: boolean }
            utility: { $ref: "#/components/schemas/UtilityCard" }
        objects: { type: array, items: { $ref: "#/components/schemas/PlayerObjectView" } }
        agents: { type: array, items: { $ref: "#/components/schemas/PlayerAgentView" } }
        transformations:
          type: array
          items:
            type: object
            required: [id, agentId, before, after]
            properties:
              id: { type: string }
              agentId: { type: string }
              before: { oneOf: [{ type: integer }, { type: string }] }
              after: { oneOf: [{ type: integer }, { type: string }] }
              calls: { type: array, items: { type: array, items: {} } }
              cost: { type: number }
        leaderboard:
          type: array
          items:
            type: object
            required: [godId, label, isAI, totalPayoff]
            properties:
              godId: { type: string }
              label: { type: string }
              isAI: { type: boolean }
              totalPayoff: { type: number }
        chat: { type: array, items: { $ref: "#/components/schemas/PlayerChat" } }
    PlayerChat:
      type: object
      required: [id, godId, label, isAI, text]
      properties:
        id: { type: string }
        godId: { type: string }
        label: { type: string }
        isAI: { type: boolean }
        text: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

