# Deploys the engine (functions, the Python runtime bundle, both static sites) to Convex.
#   push to develop → GitHub Environment "development" → the dev deployment
#   push to main    → GitHub Environment "production"  → the production deployment
# Each environment holds one secret, CONVEX_DEPLOY_KEY (a deploy key for that deployment); the key alone
# selects the deployment. Setup and recovery: PILOT.md, "Automatic deploys".
#
# The gate is the `checks` job: root typecheck, the offline unit suites (game-utilities split over 8 parallel shards,
# the rest in one job), calibration freshness and the sandbox tests; each part is its own parallel job and `checks`
# aggregates them. Pushing to develop runs it beside the deploy: it marks the commit red on failure but never holds
# back the dev deploy, which keeps only the cheap checks (env var names, the functions typecheck in `convex deploy`,
# the worker build, the bundle pin, the post-deploy smoke test). A production deploy waits for it, after doing its own
# install and bundle build in parallel, except when `lookup` finds that the gate already passed on develop for a commit
# with the identical tree (a release is a merge of develop, so usually it did): then nothing is re-run.
# Any doubt (no match, API error, a red or cancelled run) runs the gate in full.
name: Deploy

on:
  push:
    branches: [develop, main]
    paths-ignore: ['**/*.md', 'docs/**', '.agents/**', '.claude/**']   # docs-only pushes don't deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- main only: did the gate already pass on develop for this exact tree? ----
  lookup:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # list the develop runs and their jobs
    outputs:
      passed: ${{ steps.find.outputs.passed }}   # "true" only on a proven match; empty (job failed) counts as not passed
    steps:
      - uses: actions/checkout@v4
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/previous-gate.mjs "$(git rev-parse 'HEAD^{tree}')" | tee -a "$GITHUB_OUTPUT"

  # ---- the gate: parallel parts, aggregated by `checks` ----
  typecheck:
    needs: lookup
    if: ${{ !cancelled() && (github.ref_name == 'develop' || needs.lookup.outputs.passed != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gate-typecheck-${{ github.ref_name }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc --build incremental state (~31s cold, ~15s warm). Every library's dist goes with its build info: restoring the
      # info without the output makes tsc report TS6305 ("output file has not been built from source") for every importer.
      - uses: actions/cache@v4
        with:
          path: |
            lib/*/tsconfig.tsbuildinfo
            lib/*/dist
            artifacts/*/tsconfig.tsbuildinfo
          key: tsbuild2-${{ github.sha }}   # tsbuild2: caches saved before every dist was included must never be restored
          restore-keys: tsbuild2-
      - run: pnpm run typecheck

  # The offline unit suites. game-utilities holds nearly all the time (its calibration, analytic and family-law tests
  # loop over every family and instantiation), so its loops are split by CG_SHARD=k/8 (lib/game-utilities/test/shard.ts);
  # shards 1..8 together cover every item once. "rest" is every other suite plus calibration freshness.
  unit:
    needs: lookup
    if: ${{ !cancelled() && (github.ref_name == 'develop' || needs.lookup.outputs.passed != 'true') }}
    name: unit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8', rest]
    concurrency:
      group: gate-unit-${{ matrix.shard }}-${{ github.ref_name }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The "rest" shard runs the tests that compile a starter agent (ai-player, engine example agents), which need the
      # pinned Python runtime; `dist/python-runtime.bin.gz` is built, not committed, so this shard builds it too.
      - if: matrix.shard == 'rest'
        uses: actions/cache@v4
        id: cpython
        with:
          path: .cache/code-gods
          key: cpython-wasi-${{ hashFiles('lib/game-runtime/python/setup.py') }}
      - if: matrix.shard == 'rest' && steps.cpython.outputs.cache-hit != 'true'
        run: pnpm --filter @workspace/game-runtime setup:python
      - if: matrix.shard == 'rest'
        run: pnpm --filter @workspace/game-runtime build:python
      - if: matrix.shard != 'rest'
        run: pnpm --filter @workspace/game-utilities test
        env:
          CG_SHARD: ${{ matrix.shard }}
      - if: matrix.shard == 'rest'
        run: pnpm run test:offline:rest
        env:
          CG_REQUIRE_PYTHON_RUNTIME: 1   # a test that needs the bundle fails here instead of skipping itself
      - name: Calibration tables are fresh   # every instance file in git matches the current code (seconds; builds nothing)
        if: matrix.shard == 'rest'
        run: pnpm --filter @workspace/game-utilities calibrate --check

  # The sandbox tests (Python bundle, QuickJS worker).
  runtime:
    needs: lookup
    if: ${{ !cancelled() && (github.ref_name == 'develop' || needs.lookup.outputs.passed != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gate-runtime-${{ github.ref_name }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        id: cpython
        with:
          path: .cache/code-gods
          key: cpython-wasi-${{ hashFiles('lib/game-runtime/python/setup.py') }}
      - if: steps.cpython.outputs.cache-hit != 'true'
        run: pnpm --filter @workspace/game-runtime setup:python
      - run: pnpm --filter @workspace/game-runtime build:python
      - run: pnpm --filter @workspace/game-runtime test

  # The one name the rest of the workflow (and `previous-gate.mjs`) relies on: success only when every part succeeded.
  # Skipped (not failed) when `lookup` proved the gate already passed on this tree.
  checks:
    needs: [lookup, typecheck, unit, runtime]
    if: ${{ !cancelled() && (github.ref_name == 'develop' || needs.lookup.outputs.passed != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.typecheck.result }} ${{ needs.unit.result }} ${{ needs.runtime.result }}
        run: |
          echo "typecheck / unit / runtime: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::The gate did not pass"; exit 1; }; done

  deploy:
    needs: lookup   # skipped on develop, which does not wait for the gate
    if: ${{ !cancelled() && (github.ref_name == 'develop' || github.ref_name == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read   # the production gate wait reads this run's jobs
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && 'production' || 'development' }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}   # a newer develop push supersedes; production never cancels
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ---- the pinned runtime bundle (Python) ----
      - uses: actions/cache@v4
        id: cpython
        with:
          path: .cache/code-gods
          key: cpython-wasi-${{ hashFiles('lib/game-runtime/python/setup.py') }}
      - if: steps.cpython.outputs.cache-hit != 'true'
        run: pnpm --filter @workspace/game-runtime setup:python
      - run: pnpm --filter @workspace/game-runtime build:python
      - name: Worker build is current   # 0.1s; never deploy a stale sandbox worker
        working-directory: lib/game-runtime
        run: node scripts/build-worker.mjs --check
      # ---- production: nothing below this line ships until the gate has passed (the steps above ran beside it) ----
      - name: Wait for the gate
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED_ON_DEVELOP: ${{ needs.lookup.outputs.passed }}
        run: |
          if [ "$PASSED_ON_DEVELOP" = true ]; then echo "The gate already passed on develop for this exact tree (see the lookup job); not re-run."; exit 0; fi
          # `checks` finishes only after every gate part, and is skipped or failed otherwise; poll its conclusion.
          while true; do
            job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name == "checks") | "\(.status) \(.conclusion)"' || true)   # a transient API error just polls again
            echo "checks: ${job:-not started}"
            case "$job" in
              "completed success") exit 0 ;;
              completed*) echo "::error::The gate failed: nothing is deployed to production"; exit 1 ;;
            esac
            sleep 15
          done

      # ---- deploy (from here on the deploy key is in the environment) ----
      - name: Check the deployment's env vars
        working-directory: artifacts/engine
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          test -n "$CONVEX_DEPLOY_KEY" || { echo "::error::Secret CONVEX_DEPLOY_KEY is not set in this GitHub Environment"; exit 1; }
          names=$(npx convex env list --names-only)   # names only, never values
          missing=""; forbidden=""
          for n in BETTER_AUTH_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET PLAYER_JWT_PRIVATE_KEY PLAYER_JWT_JWKS SEASON_SALT ADMIN_EMAILS; do
            if ! grep -qx "$n" <<<"$names"; then missing="$missing $n"; fi
          done
          for n in DEV TEST_FIXTURES AI_MOCK FAKE_OIDC_URL PREVIEW_SIGN_IN_CODE; do   # the last: preview deployments only (docs/preview-deployments.md)
            if grep -qx "$n" <<<"$names"; then forbidden="$forbidden $n"; fi
          done
          stale=$(grep '^CODE_GODS_' <<<"$names" | tr '\n' ' ' || true)   # renamed without the prefix (PILOT.md)
          [ -z "$stale" ] || { echo "::error::Old CODE_GODS_ env vars on the deployment: $stale(move each to its new name, then remove it)"; exit 1; }
          [ -z "$forbidden" ] || { echo "::error::Test-only or preview-only env vars set on this deployment:$forbidden (remove them)"; exit 1; }
          [ -z "$missing" ] || { echo "::error::Missing deployment env vars:$missing (see PILOT.md)"; exit 1; }

      - name: Push functions
        working-directory: artifacts/engine
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --typecheck enable   # never skip the functions typecheck: on develop it is the gate

      - name: Record the functions version   # open clients watch version:current (convex/version.ts)
        working-directory: artifacts/engine
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run version:record "{\"site\":\"functions\",\"build\":\"${GITHUB_SHA::12}\"}"

      - name: Upload the calibration tables   # right after the push: the new code reads tables from storage (unchanged files are skipped)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm --filter @workspace/engine upload-calibration

      - name: Better Auth JWKS (first deploy only)
        working-directory: artifacts/engine
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if npx convex env list --names-only | grep -qx BETTER_AUTH_JWKS; then echo "BETTER_AUTH_JWKS is set"; exit 0; fi
          # rotateKeys prints the keys as a JSON array (scripts/dev.mjs stores it the same way).
          # The JWKS (compacted to one line) stays in a shell variable and goes to env set on stdin, never to the log;
          # an empty or invalid result stops here, so a broken value is never stored.
          jwks=$(npx convex run auth/betterAuth:rotateKeys \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!(Array.isArray(j)?j:j.keys)?.length)process.exit(1);process.stdout.write(JSON.stringify(j))})')
          [ -n "$jwks" ] || { echo "::error::rotateKeys returned no keys"; exit 1; }
          printf '%s' "$jwks" | npx convex env set BETTER_AUTH_JWKS
          npx convex deploy   # push again so auth.config.ts inlines the JWKS

      - name: Sync the system game setups with the code (idempotent)
        working-directory: artifacts/engine
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run setups:ensureSeeded

      - name: Migrate stored settings (setups-v2, allowed languages) and room setups (idempotent; convex/migrations.ts)
        working-directory: artifacts/engine
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run migrations/node:setupsV2

      - name: Give AI seats unique names (idempotent; convex/migrations.ts aiSeatNames)
        working-directory: artifacts/engine
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run migrations:aiSeatNames

      - name: Key the assistant's stored state by (player, game) (idempotent; convex/migrations.ts assistant-per-game)
        working-directory: artifacts/engine
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run migrations:assistantPerGame

      - name: Schema migrations (the @convex-dev/migrations component; waits for every one; CLAUDE.md "Schema migrations")
        working-directory: artifacts/engine
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: node scripts/run-migrations.mjs

      - name: Warm the hold-rarity cache (scheduled in the background; never blocks the deploy)
        working-directory: artifacts/engine
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run engine/holdData:scheduleWarm

      - name: Upload the runtime bundle (Python)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm --filter @workspace/engine upload-runtime

      - name: Build and upload the static sites
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm --filter @workspace/engine deploy-static --if-changed   # skips a site whose identical build is live

      - name: Smoke test
        working-directory: artifacts/engine
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          site=$(npx convex run --component engineSite lib:getUrls '{}' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).siteUrl.replace(/\/$/,"")))')
          echo "site: $site"
          curl -fsS "$site/api/health"; echo
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$site/mcp" -H 'Content-Type: application/json' -d '{}')
          [ "$code" = 401 ] || { echo "::error::/mcp answered $code without a token (expected 401)"; exit 1; }
          for language in python typescript; do npx convex run runtime/probe:smoke "{\"language\":\"$language\"}"; done
          # A two-language game's pools busy at once on one instance, within its memory budget (TypeScript compiled apart).
          npx convex run runtime/probe:concurrent '{}'
          # Lazy load from storage round-trips: the Grid default's tables serve a fresh table.
          npx convex run calibration/node:probe '{"settings":{"objectType":"Grid","typeArgs":{"size":4,"symbols":"base10","colours":"rgb"},"priorId":"uniform"},"draw":{"familyId":"seed3_green_ones","params":{"colour":0,"value":0}},"refresh":true}' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log(JSON.stringify(r));if(!r.key||!r.tables)process.exit(1)})'

      - name: Games in progress are still ticking   # last, read-only (engine/loop:liveProgress): fails loudly if a running game stalled
        working-directory: artifacts/engine
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: node scripts/check-live-games.mjs
