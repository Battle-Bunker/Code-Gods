<!doctype html>
<!--
  Mockups of the replay view (docs/replay-design.md §4–§9). Static: rendered to PNGs by render.mjs beside this file.
  ?state=scrub | step | moments | loading | mobile. Data is synthetic (a seeded generator), shaped like a real game.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay mockup</title>
<style>
  :root {
    --bg: hsl(40 33% 94%); --fg: hsl(232 38% 14%); --card: hsl(42 40% 97%); --border: hsl(36 18% 80%);
    --muted: hsl(38 24% 88%); --muted-fg: hsl(232 12% 42%); --primary: hsl(9 82% 50%); --accent: hsl(168 52% 30%);
    --yours: #0b6aa0; --others: #b52d6e; --amber: #c98a06; --sidebar: hsl(232 38% 14%);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 'Bricolage Grotesque', system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  header { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--sidebar); color: hsl(40 33% 92%); }
  header .crumb { opacity: .7 } header b { font-weight: 600 }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .badge.replay { color: #ffd27a; }
  header .spacer { flex: 1 }
  header .search { width: 220px; height: 26px; border-radius: 3px; background: hsl(232 28% 22%); color: hsl(40 33% 70%); padding: 4px 8px; font-size: 12px; }
  /* the transport strip: shell chrome in replay mode, always present */
  .transport { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--card); border-bottom: 1px solid var(--border); }
  .btn { height: 26px; min-width: 26px; padding: 0 8px; border: 1px solid var(--border); border-radius: 3px; background: var(--card); display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 12px; }
  .btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
  .clock { font-variant-numeric: tabular-nums; }
  .mini { flex: 1; height: 14px; position: relative; }
  .dock { display: grid; gap: 6px; padding: 6px; height: calc(100vh - 84px); }
  .pane { background: var(--card); border: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .pane > .ph { height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 12px; }
  .pane > .ph .cap { font-weight: 400; color: var(--muted-fg); }
  .pane > .ph .menu { margin-left: auto; color: var(--muted-fg); font-weight: 400 }
  .pane > .pb { padding: 10px; overflow: hidden; flex: 1; min-height: 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--muted); }
  .muted { color: var(--muted-fg); } .small { font-size: 11px; }
  .flash { animation: flash 1.2s ease-out; background: hsl(42 90% 60% / .35); }
  .tag { font-size: 10px; padding: 0 5px; border-radius: 3px; background: var(--muted); }
  .tag.mine { background: color-mix(in srgb, var(--yours) 18%, white); color: var(--yours) }
  .tag.dead { text-decoration: line-through; }
  .future { opacity: .32; }
  pre { margin: 0; font: 11px/1.45 'JetBrains Mono', monospace; background: hsl(40 25% 92%); padding: 6px 8px; border-radius: 3px; white-space: pre-wrap; }
  .grid5 { display: grid; grid-template-columns: repeat(5, 18px); gap: 2px; }
  .grid5 span { width: 18px; height: 18px; border-radius: 2px; font: 10px/18px 'JetBrains Mono', monospace; text-align: center; color: white; }
  .hl { outline: 2px solid var(--primary); outline-offset: 1px; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted-fg) } .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px }
  .assistant { background: hsl(232 30% 97%); }
  .bubble { background: white; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
  .notice { margin: 6px 6px 0; padding: 6px 10px; border: 1px solid hsl(42 80% 48%); background: hsl(42 90% 92%); font-size: 12px; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; background: white; border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 8px; color: var(--muted-fg) }
</style>
</head>
<body>
<header>
  <span class="crumb">Room <b class="mono">K7QX</b> · games ·</span><b class="mono">G3MT</b>
  <span class="badge replay">Replay</span>
  <span class="crumb">Ended 31 Oct, 21:14 · lifetime · 3 players</span>
  <span class="spacer"></span>
  <span class="search">Search commands…  ⌘K</span>
</header>
<div class="transport" id="transport"></div>
<div id="notice"></div>
<div class="dock" id="dock"></div>
<script>
const state = new URLSearchParams(location.search).get("state") || "scrub";
// ---- a seeded synthetic game -----------------------------------------------------------------
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const END = 612, T = state === "step" ? 241.6 : state === "moments" ? 388.2 : 306.4;
const pts = []; let own = 0, peer = 0;
for (let w = 0; w <= END; w += 2) {
  own += (rnd() - 0.46) * 6 + (w > 380 && w < 420 ? 9 : 0) - (w > 470 && w < 500 ? 7 : 0);
  peer += (rnd() - 0.42) * 5;
  pts.push({ w, own, peer: Math.max(0, peer), score: own * Math.max(0, peer) / 40 });
}
const totals = [0, 1, 2].map(k => pts.map(p => ({ w: p.w, y: k === 0 ? p.score : p.score * (0.6 + 0.25 * k) + Math.sin(p.w / (40 + 20 * k)) * 60 * k })));
const markers = [
  ...[0, 0, 4, 31, 122, 260, 340].map((w, i) => ({ w, kind: "summon", mine: i % 3 === 0 })),
  { w: 205, kind: "destroy", mine: true },
  ...[18, 64, 96, 150, 199, 233, 302, 361, 455, 530].map(w => ({ w, kind: "chat" })),
  { w: 397, kind: "swing", up: true, label: "+412" }, { w: 488, kind: "swing", up: false, label: "−301" }, { w: 180, kind: "swing", up: true, label: "+188" },
  { w: 151, kind: "lead" }, { w: 401, kind: "lead" },
];
const pauses = [{ w: 233, wall: 60, who: "Bo" }];
const fmt = n => (Math.abs(n) >= 100 ? Math.round(n) : n.toFixed(1));
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

// ---- transport strip ------------------------------------------------------------------------
function transport(compact) {
  const x = w => (w / END * 100).toFixed(2) + "%";
  const ticks = markers.map(m => `<span style="position:absolute;left:${x(m.w)};top:${m.kind === "chat" ? 9 : 1}px;width:2px;height:${m.kind === "chat" ? 5 : 8}px;background:${
    m.kind === "summon" ? (m.mine ? "var(--yours)" : "var(--muted-fg)") : m.kind === "chat" ? "var(--accent)" : m.kind === "swing" ? "var(--amber)" : m.kind === "destroy" ? "var(--others)" : "var(--fg)"}"></span>`).join("");
  return `<button class="btn" title="Previous key moment (Shift+←)">⏮</button><button class="btn" title="Previous event (←)">◂</button>
    <button class="btn primary" title="Play (Space)">${state === "step" ? "▶" : "❚❚"}</button><button class="btn" title="Next event (→)">▸</button><button class="btn" title="Next key moment (Shift+→)">⏭</button>
    <select class="btn"><option>${state === "moments" ? "8×" : "2×"}</option></select>
    <span class="clock mono">${mmss(T)} <span class="muted">/ ${mmss(END)} world</span></span>
    ${compact ? "" : `<span class="muted small mono">event ${state === "step" ? "1,207" : "1,642"} of 3,118 · 21:${state === "step" ? "07:12" : "08:31"} wall</span>`}
    <div class="mini" title="The whole game: click to seek"><div style="position:absolute;inset:6px 0 auto 0;height:2px;background:var(--muted)"></div>
      <div style="position:absolute;left:0;top:6px;height:2px;width:${x(T)};background:var(--primary)"></div>${ticks}
      <div style="position:absolute;left:${x(T)};top:-1px;width:3px;height:16px;background:var(--primary)"></div></div>
    ${compact ? "" : `<button class="btn" title="Copy a link to this moment">Link ?t=${T}</button><button class="btn" title="Back to the room">Exit replay</button>`}`;
}

// ---- the timeline panel ---------------------------------------------------------------------
function timeline(w, h) {
  const padL = 48, padR = 10, top = 26, band = 44, curveH = h - top - band - 34;
  const X = s => padL + s / END * (w - padL - padR);
  const vals = pts.flatMap(p => [p.own, p.peer]);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const Y = v => top + band + (1 - (v - lo) / (hi - lo)) * curveH;
  const sc = pts.map(p => p.score), slo = Math.min(...sc), shi = Math.max(...sc);
  const YS = v => top + band + (1 - (v - slo) / (shi - slo)) * curveH;
  const path = (f, Yf) => pts.map((p, i) => `${i ? "L" : "M"}${X(p.w).toFixed(1)},${Yf(f(p)).toFixed(1)}`).join("");
  const past = `<clipPath id="past"><rect x="0" y="0" width="${X(T)}" height="${h}"/></clipPath>`;
  const lane = (y, label) => `<text x="4" y="${y + 4}" font-size="10" fill="var(--muted-fg)">${label}</text><line x1="${padL}" x2="${w - padR}" y1="${y}" y2="${y}" stroke="var(--muted)"/>`;
  const lanes = { summon: top + 6, chat: top + 20, swing: top + 34 };
  const glyph = m => {
    const x = X(m.w);
    if (m.kind === "summon") return `<path d="M${x},${lanes.summon - 4}l4,4l-4,4l-4,-4z" fill="${m.mine ? "var(--yours)" : "none"}" stroke="${m.mine ? "var(--yours)" : "var(--muted-fg)"}"/>`;
    if (m.kind === "destroy") return `<path d="M${x - 3},${lanes.summon - 3}l6,6M${x + 3},${lanes.summon - 3}l-6,6" stroke="var(--others)" stroke-width="1.5"/>`;
    if (m.kind === "chat") return `<rect x="${x - 3}" y="${lanes.chat - 3}" width="7" height="5" rx="1.5" fill="var(--accent)"/>`;
    if (m.kind === "swing") return `<path d="M${x},${lanes.swing + (m.up ? -4 : 4)}l4,${m.up ? 7 : -7}h-8z" fill="var(--amber)"/><text x="${x + 6}" y="${lanes.swing + 3}" font-size="9" fill="var(--amber)">${m.label}</text>`;
    if (m.kind === "lead") return `<line x1="${x}" x2="${x}" y1="${top + band}" y2="${top + band + curveH}" stroke="var(--fg)" stroke-dasharray="2 3" opacity=".5"/><text x="${x + 3}" y="${top + band + 10}" font-size="9" fill="var(--muted-fg)">lead change</text>`;
    return "";
  };
  const pause = pauses.map(p => `<line x1="${X(p.w)}" x2="${X(p.w)}" y1="${top}" y2="${top + band + curveH}" stroke="var(--fg)" stroke-width="3" opacity=".18"/><text x="${X(p.w) + 4}" y="${top + band + curveH - 4}" font-size="9" fill="var(--muted-fg)">paused 60 s by ${p.who}</text>`).join("");
  const xt = [0, 100, 200, 300, 400, 500, 600].map(s => `<text x="${X(s)}" y="${h - 18}" font-size="10" text-anchor="middle" fill="var(--muted-fg)">${mmss(s)}</text>`).join("");
  return `<svg width="${w}" height="${h}" style="display:block">
    <defs>${past}</defs>
    <rect x="${padL}" y="${top}" width="${X(0) - padL + 0.001 + (X(6) - X(0))}" height="${band + curveH}" fill="hsl(232 30% 90% / .5)"/>
    <text x="${padL + 2}" y="${top - 6}" font-size="10" fill="var(--muted-fg)">planning</text>
    ${lane(lanes.summon, "agents")}${lane(lanes.chat, "chat")}${lane(lanes.swing, "swings")}
    ${markers.map(glyph).join("")}${pause}
    <g opacity=".3"><path d="${path(p => p.own, Y)}" fill="none" stroke="var(--yours)" stroke-width="1.5"/><path d="${path(p => p.peer, Y)}" fill="none" stroke="var(--others)" stroke-width="1.5"/><path d="${path(p => p.score, YS)}" fill="none" stroke="var(--amber)" stroke-width="2"/></g>
    <g clip-path="url(#past)"><path d="${path(p => p.own, Y)}" fill="none" stroke="var(--yours)" stroke-width="1.5"/><path d="${path(p => p.peer, Y)}" fill="none" stroke="var(--others)" stroke-width="1.5"/><path d="${path(p => p.score, YS)}" fill="none" stroke="var(--amber)" stroke-width="2.2"/></g>
    <line x1="${X(T)}" x2="${X(T)}" y1="${top - 10}" y2="${h - 28}" stroke="var(--primary)" stroke-width="2"/>
    <rect x="${X(T) - 24}" y="${top - 22}" width="48" height="13" rx="2" fill="var(--primary)"/><text x="${X(T)}" y="${top - 12}" font-size="10" text-anchor="middle" fill="white">${mmss(T)}</text>
    ${xt}<text x="${w - padR}" y="${h - 4}" font-size="10" text-anchor="end" fill="var(--muted-fg)">world time (pauses take no width) · drag to scrub · ←/→ one event</text>
  </svg>
  <div class="legend"><span><i style="background:var(--yours)"></i>your bits (Σ)</span><span><i style="background:var(--others)"></i>others' bits (Σ)</span><span><i style="background:var(--amber);height:4px"></i>your score (Σ your bits × their care)</span><span class="muted">faded: after the playhead</span></div>`;
}

// ---- panes ---------------------------------------------------------------------------------
const colours = { r: "#c0392b", g: "#2e8b57", b: "#2563a8", y: "#c9a106" };
const grid = (seedV, mark = []) => { seed = seedV; return `<div class="grid5">${Array.from({ length: 25 }, (_, i) => {
  const c = "rgby"[Math.floor(rnd() * 4)], d = Math.floor(rnd() * 10);
  return `<span class="${mark.includes(i) ? "hl" : ""}" style="background:${colours[c]}">${d}</span>`; }).join("")}</div>`; };
function objects(n) {
  const rows = [
    ["o·4fa2", 41.2, 18.6, true], ["o·9c01", 33.0, 15.1], ["o·77be", 22.7, 21.0], ["o·1d3c", 19.4, 9.2], ["o·e510", 12.1, 30.4], ["o·0b9a", 8.8, 4.0],
  ].slice(0, n);
  return rows.map(([id, mine, care, changed], i) => `<div class="row ${changed && state !== "loading" ? "flash" : ""}">
      ${grid(31 + i, changed ? [6, 7, 8] : [])}
      <div style="flex:1"><div class="mono small">${id} ${changed ? '<span class="tag mine">changed 0.4 s ago · your agent</span>' : ""}</div>
      <svg width="140" height="22"><rect x="0" y="${22 - care / 2}" width="${mine * 2}" height="${care / 2}" fill="color-mix(in srgb, var(--amber) ${40 + (6 - i) * 8}%, white)" stroke="var(--amber)"/></svg></div>
      <div class="mono small" style="text-align:right"><span style="color:var(--yours)">${mine}</span> × <span style="color:var(--others)">${care}</span><br><b>${fmt(mine * care)}</b></div></div>`).join("");
}
function agents() {
  return `<div class="row"><span class="tag mine">yours</span><b class="mono">a·71c</b><span class="muted small">summoned 0:00 · 48 acts (41 changed) · energy 23/80</span></div>
    <pre>def agent(grid):\n    return [slide(row(1), 2)]</pre>
    <div class="row"><span class="tag mine dead">yours</span><b class="mono">a·2e0</b><span class="muted small">0:04 → destroyed 3:25 · 19 acts</span></div>
    <div class="row"><span class="tag">another player's</span><b class="mono">a·d93</b><span class="muted small">appeared 0:31 · 37 changes seen</span></div>
    <div class="row future"><span class="tag">another player's</span><b class="mono">a·5b4</b><span class="muted small">appears at 5:40</span></div>
    <p class="muted small">Other players' agents: when they appeared and what they changed, never their code or owner.</p>`;
}
function chat() {
  const msgs = [["0:18", "Ada", "I'll take red rows if someone leaves column 2 alone"], ["1:04", "Bo (AI)", "Deal. I'm pushing digits up on the left."],
    ["2:30", "You", "Careful, 4fa2 is mine — please don't slide row 1"], ["3:53", "Bo (AI)", "Pausing to rethink."], ["5:02", "Ada", "gg"]];
  return msgs.map(([t, who, text], i) => `<div class="row ${i >= 4 ? "future" : ""}" style="align-items:flex-start"><span class="mono small muted" style="width:34px">${t}</span><div><b>${who}</b> ${text}</div></div>`).join("")
    + `<p class="muted small">Messages after the playhead are faded; click one to seek to it.</p>`;
}
function step() {
  return `<div style="display:flex;gap:16px;align-items:center">
      <div><div class="small muted">before (v12)</div>${grid(31, [5, 6, 7, 8, 9])}</div>
      <div style="font-size:20px">→</div>
      <div><div class="small muted">after (v13)</div><div class="flash" style="padding:2px">${grid(32, [5, 6, 7, 8, 9])}</div></div>
      <div style="flex:1">
        <div><b>Your agent a·71c</b> changed <span class="mono">o·4fa2</span> at 4:01.6</div>
        <div class="mono small">calls: slide(row(1), 2)</div>
        <div class="small">cost 14.2 bits (naming 6.0 · erasure 3.1 · motion 5.1)</div>
        <div class="small">you <span style="color:var(--yours)">+6.3</span> bits · others <span style="color:var(--others)">−2.1</span> · payoff <b>+88</b></div>
      </div></div>
    <p class="muted small" style="margin-top:8px">Event 1,207 of 3,118. ← and → step one event; the cells that moved are outlined, the row slides into place over 300 ms.</p>`;
}
function moments() {
  const list = [["0:00", "Game starts · 40 objects"], ["0:31", "First change by another player"], ["2:31", "Ada takes the lead"], ["3:53", "Bo pauses (60 s)"],
    ["6:37", "Your biggest gain · +412 on o·9c01"], ["6:41", "You take the lead"], ["8:08", "Your biggest loss · −301"], ["10:12", "Game ends (lifetime) · you finish 1st"]];
  return list.map(([t, l], i) => `<div class="row ${i === 4 ? "flash" : ""}"><span class="mono small" style="width:40px">${t}</span><span>${l}</span><span class="muted small" style="margin-left:auto">Shift+→</span></div>`).join("");
}
function race() {
  const w = 360, h = 120, X = s => 6 + s / END * (w - 12);
  const all = totals.flat().map(p => p.y), lo = Math.min(...all), hi = Math.max(...all), Y = v => 6 + (1 - (v - lo) / (hi - lo)) * (h - 12);
  const cols = ["var(--primary)", "var(--accent)", "hsl(232 38% 30%)"];
  return `<svg width="${w}" height="${h}">${totals.map((s, k) => `<path d="${s.filter(p => p.w <= T).map((p, i) => `${i ? "L" : "M"}${X(p.w)},${Y(p.y)}`).join("")}" fill="none" stroke="${cols[k]}" stroke-width="${k ? 1.3 : 2.2}"/>`).join("")}
    <line x1="${X(T)}" x2="${X(T)}" y1="0" y2="${h}" stroke="var(--primary)" opacity=".5"/></svg>
    <div class="row"><b>1</b> You <span class="mono" style="margin-left:auto">2,941</span></div><div class="row">2 Ada <span class="mono" style="margin-left:auto">2,610</span></div><div class="row">3 Bo · AI <span class="mono" style="margin-left:auto">1,077</span></div>`;
}
const pane = (title, cap, body, extra = "") => `<div class="pane" ${extra}><div class="ph">${title}<span class="cap">${cap}</span><span class="menu">▾</span></div><div class="pb">${body}</div></div>`;

const T_ = document.getElementById("transport"), D = document.getElementById("dock"), N = document.getElementById("notice");
if (state === "mobile") {
  T_.innerHTML = transport(true);
  T_.style.cssText = "height:auto;flex-wrap:wrap;padding:6px 12px";
  T_.querySelector(".mini").style.cssText = "flex:1 0 100%;height:18px;position:relative;margin-top:4px";
  D.style.cssText = "display:flex;flex-direction:column;height:auto;padding:6px 6px 70px";
  D.innerHTML = pane("Timeline", "at 5:06", timeline(372, 200)) + pane("Objects by payoff", "at 5:06", objects(3)) + pane("Public chat", "up to 5:06", chat());
  document.body.insertAdjacentHTML("beforeend", `<div class="sheet">Ask your assistant about this moment…</div>`);
  document.querySelector("header .search").remove(); document.querySelectorAll("header .crumb")[1].remove();
} else {
  T_.innerHTML = transport(false);
  if (state === "loading") N.innerHTML = `<div class="notice">Loading the replay: 1,840 of 9,212 events (the timeline is drawn as far as it is loaded; you can already scrub there). This game was recorded before agent summons were logged: other players' agents and the leaderboard curve are missing before 2:10.</div>`;
  D.style.gridTemplateColumns = "1.25fr 1fr 0.85fr";
  D.style.gridTemplateRows = state === "loading" ? "1fr 300px" : "1fr 300px";
  const second = state === "step" ? pane("This change", "event 1,207 · your agent", step()) : state === "moments" ? pane("Key moments", "8 found", moments()) : pane("Agents", "alive at 5:06", agents());
  D.innerHTML =
    pane("Objects by payoff", `at ${mmss(T)} · top 6`, objects(6)) +
    second +
    `<div class="pane assistant" style="grid-row: span 2"><div class="ph">Your assistant <span class="cap">(private)</span></div><div class="pb">
      <div class="bubble"><b>You</b>: why did my score jump here?</div>
      <div class="bubble"><b>Assistant</b>: At 6:37 your agent slid row 1 of o·9c01 so its red cells line up: +18 of your bits while the others' care stayed at 22, so its payoff rose by 412. Bo's agent undid half of it at 8:08.</div>
      <div class="bubble muted small">Jumped to 6:37 · opened Key moments</div></div></div>` +
    pane("Timeline", "your bits, the others', your score · markers", timeline(state === "loading" ? 800 : 820, 262), `style="grid-column: span ${state === "moments" ? 1 : 2}"`) +
    (state === "moments" ? pane("Race", "totals over time", race()) : "");
  if (state === "loading") {
    const svg = D.querySelector(".pane:nth-of-type(4) svg");
    if (svg) svg.insertAdjacentHTML("beforeend", `<rect x="${44 + 0.42 * (800 - 54)}" y="16" width="${0.58 * (800 - 54)}" height="210" fill="hsl(40 25% 92% / .92)"/><text x="${44 + 0.70 * (800 - 54)}" y="120" font-size="12" text-anchor="middle" fill="var(--muted-fg)">loading… 20 %</text>`);
  }
}
</script>
</body>
</html>
