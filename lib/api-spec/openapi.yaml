openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      responses:
        "200":
          description: Current browser identity
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/AuthUser"
                      - { type: "null" }
  /ai-agents:
    get:
      operationId: listPublicAiAgents
      responses:
        "200":
          description: Authenticated public agent catalog, without prompts
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/PublicAiAgent" }
        "401": { description: Authentication required }
  /admin/ai-agents:
    get:
      operationId: listAdminAiAgents
      responses:
        "200":
          description: Editable agents and model catalog
          content:
            application/json:
              schema:
                type: object
                required: [agents, models]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/AiAgent" }
                  models:
                    type: array
                    items: { $ref: "#/components/schemas/AiAgentModel" }
        "401": { description: Authentication required }
        "403": { description: Verified allowlisted browser identity required }
    post:
      operationId: createAdminAiAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentInput" }
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgent" }
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "403": { description: Verified allowlisted browser identity required }
  /admin/ai-agents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateAdminAiAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentUpdate" }
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgent" }
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "403": { description: Verified allowlisted browser identity required }
        "404": { description: Agent not found }
        "409": { description: Revision conflict }
    delete:
      operationId: deleteAdminAiAgent
      parameters:
        - { name: revision, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Deleted agent }
        "400": { description: Invalid revision }
        "401": { description: Authentication required }
        "403": { description: Verified allowlisted browser identity required }
        "404": { description: Agent not found }
        "409": { description: Revision conflict }
  /rooms:
    get:
      operationId: listRooms
      responses:
        "200":
          description: Rooms you have joined
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoomSummary" }
    post:
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomInput" }
      responses:
        "201":
          description: Created room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
  /rooms/{roomId}:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRoom
      responses:
        "200":
          description: Public room state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
  /rooms/{roomId}/actions:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
    post:
      operationId: roomAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomActionInput" }
      responses:
        "200":
          description: Updated public room state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
  /device/approve:
    post:
      operationId: approveDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceApprovalInput" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResult" }
  /manifest:
    get:
      operationId: getManifest
      responses:
        "200":
          description: Protocol and runtime capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifest" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    AuthUser:
      type: object
      required: [id, name, isAdmin]
      properties:
        id: { type: string }
        name: { type: string }
        isAdmin: { type: boolean }
    PublicAiAgent:
      type: object
      required: [id, name, provider, model]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string, enum: [anthropic, openai] }
        model: { type: string }
    AiAgent:
      allOf:
        - $ref: "#/components/schemas/PublicAiAgent"
        - type: object
          required: [prompt, revision, createdAt, updatedAt]
          properties:
            prompt: { type: string, maxLength: 10000 }
            revision: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AiAgentInput:
      type: object
      additionalProperties: false
      required: [name, provider, model, prompt]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        provider: { type: string, enum: [anthropic, openai] }
        model: { type: string }
        prompt: { type: string, maxLength: 10000 }
    AiAgentUpdate:
      type: object
      additionalProperties: false
      required: [name, provider, model, prompt, revision]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        provider: { type: string, enum: [anthropic, openai] }
        model: { type: string }
        prompt: { type: string, maxLength: 10000 }
        revision: { type: integer, minimum: 1 }
    AiAgentModel:
      type: object
      required: [id, label, provider, configured, inputUsdPerMillion, outputUsdPerMillion]
      properties:
        id: { type: string }
        label: { type: string }
        provider: { type: string, enum: [anthropic, openai] }
        configured: { type: boolean }
        inputUsdPerMillion: { type: number }
        outputUsdPerMillion: { type: number }
    StatusResult:
      type: object
      required: [status]
      properties:
        status: { type: string }
    DeviceApprovalInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 4, maxLength: 32 }
    AuthoredOption:
      type: object
      required: [id, label, languages, objectTypes]
      properties:
        id: { type: string }
        label: { type: string }
        languages:
          type: array
          items: { type: string }
        objectTypes:
          type: array
          items: { type: string }
    SettingsOptions:
      type: object
      required: [grammarId, utilitySelectorId, complexityFunctionId]
      properties:
        grammarId:
          type: array
          items: { $ref: "#/components/schemas/AuthoredOption" }
        utilitySelectorId:
          type: array
          items: { $ref: "#/components/schemas/AuthoredOption" }
        complexityFunctionId:
          type: array
          items: { $ref: "#/components/schemas/AuthoredOption" }
    Manifest:
      type: object
      required: [protocolVersion, defaults, runtimes, minimumPlayers, options, aiFunding]
      properties:
        protocolVersion: { type: integer }
        minimumPlayers: { type: integer }
        defaults: { $ref: "#/components/schemas/Settings" }
        options: { $ref: "#/components/schemas/SettingsOptions" }
        aiFunding: { $ref: "#/components/schemas/AIFunding" }
        runtimes:
          type: array
          items: { type: string }
    AIFunding:
      type: object
      required: [provider, model, billing, inputUsdPerMillion, outputUsdPerMillion, configured, live]
      properties:
        provider: { type: string, enum: [anthropic] }
        model: { type: string }
        billing: { type: string, enum: [direct] }
        inputUsdPerMillion: { type: number }
        outputUsdPerMillion: { type: number }
        configured: { type: boolean }
        live: { type: boolean }
    RoomInput:
      type: object
      additionalProperties: false
      properties: {}
    RoomActionInput:
      type: object
      required: [action, requestId]
      properties:
        action: { type: string, enum: [join, ready, settings, start, addAi, removeAi, chat, resume] }
        requestId: { type: string }
        revision: { type: integer }
        settings: { $ref: "#/components/schemas/Settings" }
        ready: { type: boolean }
        text: { type: string, maxLength: 4000 }
        deityId: { type: string }
        aiBudget: { type: integer, minimum: 0, maximum: 500000 }
        aiAgentId: { type: string }
    Settings:
      type: object
      required: [language, objectType, intMin, intMax, stringMaxLength, grammarId, utilitySelectorId, complexityFunctionId, spawnFunctionId, planningSeconds, halfLifeSeconds, startingObjectCount, spawnRateHz, interactionRateHz, interactionComputeMs, pauseSeconds, startingEnergy, energyPerSecond]
      properties:
        language: { type: string, enum: [python, typescript] }
        objectType: { type: string, enum: [Int, string] }
        intMin: { type: integer }
        intMax: { type: integer }
        stringMaxLength: { type: integer }
        grammarId: { type: string }
        utilitySelectorId: { type: string }
        complexityFunctionId: { type: string }
        spawnFunctionId: { type: string, enum: [uniform] }
        planningSeconds: { type: number }
        halfLifeSeconds: { type: number }
        startingObjectCount: { type: integer }
        spawnRateHz: { type: number }
        interactionRateHz: { type: number, minimum: 0, maximum: 1000, default: 100 }
        interactionComputeMs:
          description: Guest execution CPU budget per interaction in milliseconds; excludes compilation and worker startup. Configurable only between games.
          type: integer
          minimum: 1
          maximum: 1000
          default: 5
        pauseSeconds: { type: number }
        startingEnergy: { type: number }
        energyPerSecond: { type: number }
    RoomSummary:
      type: object
      required: [id, shortCode, ownerId, ownerName, createdAt, memberCount, phase]
      properties:
        id: { type: string }
        shortCode: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        createdAt:
          description: Unix milliseconds; null for legacy rooms whose creation time was not recorded.
          oneOf:
            - { type: number }
            - { type: "null" }
        memberCount: { type: integer }
        phase: { type: string }
    Member:
      type: object
      required: [id, name, kind, ready]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [human, ai] }
        ready: { type: boolean }
        status: { type: string }
    ChatMessage:
      type: object
      required: [id, authorId, authorName, kind, text, timestamp]
      properties:
        id: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        kind: { type: string }
        text: { type: string }
        timestamp: { type: number }
    PublicObject:
      type: object
      required: [id, value, version, totalUtility]
      properties:
        id: { type: string }
        value:
          oneOf:
            - { type: integer }
            - { type: string }
        version: { type: integer }
        totalUtility:
          type: number
          description: Sum of every god's utility for this object.
    Standing:
      type: object
      required: [deityId, name, kind, totalScore, rank]
      properties:
        deityId: { type: string }
        name: { type: string }
        kind: { type: string }
        totalScore: { type: number }
        rank: { type: integer }
    PublicGame:
      type: object
      required: [id, shortCode, phase, worldSeconds, planningEndsAt, pauseEndsAt, objects, leaderboard, agentCount]
      properties:
        id: { type: string }
        shortCode: { type: string }
        phase: { type: string }
        worldSeconds: { type: number }
        planningEndsAt: { type: number }
        pauseEndsAt: { type: number }
        agentCount: { type: integer }
        objects: { type: array, items: { $ref: "#/components/schemas/PublicObject" } }
        leaderboard: { type: array, items: { $ref: "#/components/schemas/Standing" } }
    RoomState:
      type: object
      required: [id, shortCode, ownerId, revision, settings, members, chat, game, serverTime, utilityCatalog, aiBudget, aiUsed]
      properties:
        id: { type: string }
        shortCode: { type: string }
        ownerId: { type: string }
        revision: { type: integer }
        settings: { $ref: "#/components/schemas/Settings" }
        members: { type: array, items: { $ref: "#/components/schemas/Member" } }
        chat: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
        game:
          oneOf:
            - { $ref: "#/components/schemas/PublicGame" }
            - { type: "null" }
        serverTime: { type: number }
        utilityCatalog:
          type: array
          description: Public list of utility-function families gods may have drawn for this object type.
          items: { $ref: "#/components/schemas/UtilityFamily" }
        aiBudget: { type: integer }
        aiUsed: { type: integer }
    UtilityFamily:
      type: object
      required: [id, name, theme]
      properties:
        id: { type: string }
        name: { type: string }
        theme: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

