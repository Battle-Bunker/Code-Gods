kind = "web"
previewPath = "/"
title = "Code Gods — Pantheon"
description = "The shared room display and owner control panel for Code Gods: multiplayer technical politics, room configuration, AI seating, public negotiation chat, universe objects and live leaderboards."
version = "1.0.0"
id = "artifacts/code-gods"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18323

[services.development]
run = "pnpm --filter @workspace/code-gods run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/code-gods", "run", "build" ]
serve = "static"
publicDir = "artifacts/code-gods/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18323"
BASE_PATH = "/"
