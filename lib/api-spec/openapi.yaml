openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      responses:
        "200":
          description: Current browser identity
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/AuthUser"
                      - { type: "null" }
  /ai-agents:
    get:
      operationId: listPublicAiAgents
      responses:
        "200":
          description: Authenticated public agent catalog, without prompts
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/PublicAiAgent" }
        "401": { description: Authentication required }
  /admin/ai-agents:
    get:
      operationId: listAdminAiAgents
      responses:
        "200":
          description: Editable agents and model catalog
          content:
            application/json:
              schema:
                type: object
                required: [agents, models]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/AiAgent" }
                  models:
                    type: array
                    items: { $ref: "#/components/schemas/AiAgentModel" }
        "401": { description: Authentication required }
        "403": { description: Verified allowlisted browser identity required }
    post:
      operationId: createAdminAiAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentInput" }
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgent" }
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "403": { description: Verified allowlisted browser identity required }
  /admin/ai-agents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateAdminAiAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAgentUpdate" }
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAgent" }
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "403": { description: Verified allowlisted browser identity required }
        "404": { description: Agent not found }
        "409": { description: Revision conflict }
    delete:
      operationId: deleteAdminAiAgent
      parameters:
        - { name: revision, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Deleted agent }
        "400": { description: Invalid revision }
        "401": { description: Authentication required }
        "403": { description: Verified allowlisted browser identity required }
        "404": { description: Agent not found }
        "409": { description: Revision conflict }
  /rooms:
    get:
      operationId: listRooms
      responses:
        "200":
          description: Rooms you have joined
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoomSummary" }
    post:
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomInput" }
      responses:
        "201":
          description: Created room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
  /games/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Game short code or legacy UUID }
    get:
      operationId: getGameLink
      responses:
        "200":
          description: Canonical game link and whether the room still displays this game
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameLink" }
        "401": { description: Authentication required }
        "403": { description: Player token belongs to another room }
        "404": { description: Game not found or identifier is ambiguous }
  /rooms/{roomId}:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRoom
      responses:
        "200":
          description: Public room state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
  /rooms/{roomId}/games:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listRoomGames
      responses:
        "200":
          description: Finished games played in this room, newest first. Public results only.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GameRecord" }
        "401": { description: Authentication required }
        "403": { description: Player token belongs to another room }
  /games/{code}/state:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string }, description: Game short code or UUID }
    get:
      operationId: getGameState
      responses:
        "200":
          description: One game's public state, live while it runs and final once it has ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "401": { description: Authentication required }
        "403": { description: Player token belongs to another room }
        "404": { description: Game not found or identifier is ambiguous }
  /rooms/{roomId}/actions:
    parameters:
      - { name: roomId, in: path, required: true, schema: { type: string } }
    post:
      operationId: roomAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomActionInput" }
      responses:
        "200":
          description: Updated public room state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
  /device/request:
    post:
      operationId: requestDevice
      summary: Request room-bound delegated player authorization
      description: Public S256 PKCE initiation. Labels are self-reported, not verified workspace or model identities. Permission defaults to act for existing clients.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRequestInput" }
      responses:
        "200":
          description: Five-minute human approval request; keep deviceSecret and verifier private
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRequestResult" }
        "400": { description: "Invalid room, label, permission or challenge" }
        "404": { description: Room not found or alias ambiguous }
        "429": { description: Too many device requests }
        "503": { description: Authority idle; a human must wake it }
  /device/details:
    get:
      operationId: getDeviceDetails
      description: Signed-in browser room members only. Once decided, only the deciding user may read the request.
      security: [{ browserSession: [] }]
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Server-resolved room and self-reported requester label for explicit consent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDetails" }
        "401": { description: Browser login required }
        "403": { description: Not a room member or request belongs to another user }
        "404": { description: Unknown code }
  /device/approve:
    post:
      operationId: approveDevice
      description: Explicit browser-only approval as an existing member of the requested room. Cookie requests require a same-origin Origin header.
      security: [{ browserSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceApprovalInput" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResult" }
        "400": { description: "Invalid, decided or expired code" }
        "401": { description: Browser login required }
        "403": { description: Browser identity and room membership required }
        "409": { description: Request already decided concurrently }
        "503": { description: Authority idle }
  /device/deny:
    post:
      operationId: denyDevice
      description: Browser-only denial by an existing room member. Cookie requests require a same-origin Origin header.
      security: [{ browserSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceApprovalInput" }
      responses:
        "200":
          description: Denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResult" }
        "400": { description: "Invalid, decided or expired code" }
        "401": { description: Browser login required }
        "403": { description: Browser identity and room membership required }
        "409": { description: Request already decided concurrently }
  /device/poll:
    post:
      operationId: pollDevice
      description: Public secret-and-verifier proof. Redemption is single-use and atomically issues a fifteen-minute opaque room-bound player bearer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceProofInput" }
      responses:
        "200":
          description: Approved and redeemed; keep token private
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCredential" }
        "202":
          description: Awaiting explicit human approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePendingResult" }
        "400":
          description: Denied, expired, cancelled, invalid proof or already redeemed; malformed requests may return an error instead of status
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/DeviceEndedResult" }
                  - { $ref: "#/components/schemas/ErrorResult" }
        "429": { description: Too many device requests }
  /device/cancel:
    post:
      operationId: cancelDevice
      description: Public secret-and-verifier cancellation. Also revokes the session if this request was already redeemed. Remains reachable when idle.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceProofInput" }
      responses:
        "200":
          description: Cancelled, with any corresponding live session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResult" }
        "400": { description: Invalid proof or already cancelled request }
        "429": { description: Too many device requests }
  /device/grants:
    get:
      operationId: listDeviceGrants
      description: List only the signed-in browser user's unexpired delegated sessions.
      security: [{ browserSession: [] }]
      responses:
        "200":
          description: Active grants belonging to this human, never bearer credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGrantList" }
        "401": { description: Browser login required }
        "403": { description: Browser identity required }
  /device/grants/{delegateId}/revoke:
    parameters:
      - { name: delegateId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: revokeDeviceGrant
      description: Owner-only browser revocation. Closes this delegate's passive sockets promptly without revoking unrelated browser sessions. Cookie requests require a same-origin Origin header.
      security: [{ browserSession: [] }]
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResult" }
        "401": { description: Browser login required }
        "403": { description: Browser identity required }
        "404": { description: Grant absent or owned by another user }
  /device/revoke:
    post:
      operationId: revokeDevice
      description: Revoke the authenticated player bearer itself, including read-only sessions. Does not accept browser-cookie identity and remains reachable when idle.
      security: [{ playerBearer: [] }]
      responses:
        "200":
          description: Revoked and corresponding sockets invalidated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResult" }
        "401": { description: Valid player bearer required }
        "403": { description: Browser identity cannot be revoked through this endpoint }
  /manifest:
    get:
      operationId: getManifest
      responses:
        "200":
          description: Protocol and runtime capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifest" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: cg_session
      description: Human browser session issued by Replit OIDC; delegated player sessions cannot approve, deny or manage grants.
    playerBearer:
      type: http
      scheme: bearer
      description: Opaque room-bound fifteen-minute player credential; never a host or admin identity.
  schemas:
    AuthUser:
      type: object
      required: [id, name, isAdmin]
      properties:
        id: { type: string }
        name: { type: string }
        isAdmin: { type: boolean }
    PublicAiAgent:
      type: object
      required: [id, name, provider, model]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string, enum: [anthropic, openai] }
        model: { type: string }
    AiAgent:
      allOf:
        - $ref: "#/components/schemas/PublicAiAgent"
        - type: object
          required: [prompt, revision, createdAt, updatedAt]
          properties:
            prompt: { type: string, maxLength: 10000 }
            revision: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AiAgentInput:
      type: object
      additionalProperties: false
      required: [name, provider, model, prompt]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        provider: { type: string, enum: [anthropic, openai] }
        model: { type: string }
        prompt: { type: string, maxLength: 10000 }
    AiAgentUpdate:
      type: object
      additionalProperties: false
      required: [name, provider, model, prompt, revision]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        provider: { type: string, enum: [anthropic, openai] }
        model: { type: string }
        prompt: { type: string, maxLength: 10000 }
        revision: { type: integer, minimum: 1 }
    AiAgentModel:
      type: object
      required: [id, label, provider, configured, inputUsdPerMillion, outputUsdPerMillion]
      properties:
        id: { type: string }
        label: { type: string }
        provider: { type: string, enum: [anthropic, openai] }
        configured: { type: boolean }
        inputUsdPerMillion: { type: number }
        outputUsdPerMillion: { type: number }
    StatusResult:
      type: object
      required: [status]
      properties:
        status: { type: string }
    DeviceApprovalInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 4, maxLength: 32 }
    DevicePermission:
      type: string
      enum: [read, act]
      description: read permits personal observations and passive subscriptions only; act additionally permits player commands, never host/admin operations.
    DeviceRequestInput:
      type: object
      required: [roomId, challenge]
      properties:
        roomId: { type: string, description: Canonical room UUID or authority-resolved room alias }
        challenge: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: Base64url S256 digest of the private verifier }
        clientLabel: { type: string, minLength: 1, maxLength: 120, default: "Room assistant", description: Self-reported printable label; not verified workspace or model identity }
        permission:
          allOf: [{ $ref: "#/components/schemas/DevicePermission" }]
          default: act
    DeviceRequestResult:
      type: object
      required: [deviceId, delegateId, deviceSecret, roomId, userCode, verificationPath, expiresIn, interval, permission]
      properties:
        deviceId: { type: string, format: uuid }
        delegateId: { type: string, format: uuid, description: Unique generated delegated request/session identifier; equals deviceId }
        deviceSecret: { type: string, description: Private proof material; never display in chat or logs }
        roomId: { type: string, format: uuid }
        userCode: { type: string }
        verificationPath: { type: string }
        expiresIn: { type: integer, enum: [300] }
        interval: { type: integer, enum: [2] }
        permission: { $ref: "#/components/schemas/DevicePermission" }
    DeviceProofInput:
      type: object
      required: [deviceId, deviceSecret, verifier]
      properties:
        deviceId: { type: string, minLength: 1, maxLength: 256 }
        deviceSecret: { type: string, minLength: 1, maxLength: 256 }
        verifier: { type: string, minLength: 1, maxLength: 256, description: Private verifier whose S256 digest matches the request challenge }
    DeviceCredential:
      type: object
      required: [token, expiresIn, roomId, godId, delegateId, permission]
      properties:
        token: { type: string, description: Private opaque bearer; do not display or persist to assistant output }
        expiresIn: { type: integer, enum: [900] }
        roomId: { type: string, format: uuid }
        godId: { type: string }
        delegateId: { type: string, format: uuid }
        permission: { $ref: "#/components/schemas/DevicePermission" }
    DevicePendingResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending] }
    DeviceEndedResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [denied, expired] }
    ErrorResult:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
    DeviceDetails:
      type: object
      required: [roomId, roomCode, clientLabel, permission, expiresAt, status]
      properties:
        roomId: { type: string, format: uuid }
        roomCode: { type: string }
        clientLabel: { type: string, description: Self-reported, not verified requester identity }
        permission: { $ref: "#/components/schemas/DevicePermission" }
        expiresAt: { type: string, format: date-time, description: Approval-request deadline, not a redeemed grant's lifetime }
        status: { type: string, enum: [pending, approved, denied, redeemed, expired] }
    DeviceGrant:
      type: object
      required: [delegateId, roomId, clientLabel, permission, expiresAt]
      properties:
        delegateId: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        clientLabel: { type: string, description: Self-reported, not verified requester identity }
        permission: { $ref: "#/components/schemas/DevicePermission" }
        expiresAt: { type: string, format: date-time, description: Persisted player-session expiry }
    DeviceGrantList:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items: { $ref: "#/components/schemas/DeviceGrant" }
    AuthoredOption:
      type: object
      required: [id, label, languages, objectTypes]
      properties:
        id: { type: string }
        label: { type: string }
        languages:
          type: array
          items: { type: string }
        objectTypes:
          type: array
          items: { type: string }
    SettingsOptions:
      type: object
      required: [grammarId, utilitySelectorId, complexityFunctionId]
      properties:
        grammarId:
          type: array
          items: { $ref: "#/components/schemas/AuthoredOption" }
        utilitySelectorId:
          type: array
          items: { $ref: "#/components/schemas/AuthoredOption" }
        complexityFunctionId:
          type: array
          items: { $ref: "#/components/schemas/AuthoredOption" }
    Manifest:
      type: object
      required: [protocolVersion, defaults, runtimes, minimumPlayers, options, aiFunding]
      properties:
        protocolVersion: { type: integer }
        minimumPlayers: { type: integer }
        defaults: { $ref: "#/components/schemas/Settings" }
        options: { $ref: "#/components/schemas/SettingsOptions" }
        aiFunding: { $ref: "#/components/schemas/AIFunding" }
        runtimes:
          type: array
          items: { type: string }
    AIFunding:
      type: object
      required: [provider, model, billing, inputUsdPerMillion, outputUsdPerMillion, configured, live]
      properties:
        provider: { type: string, enum: [anthropic] }
        model: { type: string }
        billing: { type: string, enum: [direct] }
        inputUsdPerMillion: { type: number }
        outputUsdPerMillion: { type: number }
        configured: { type: boolean }
        live: { type: boolean }
    RoomInput:
      type: object
      additionalProperties: false
      properties: {}
    RoomActionInput:
      type: object
      required: [action, requestId]
      properties:
        action:
          type: string
          enum: [join, leave, ready, settings, start, endGame, addAi, removeAi, chat, resume]
          description: >-
            Settings and seats describe the NEXT game and can change only while no game is active.
            `leave` is refused for the owner and for a member seated in the active game.
            `endGame` (owner) ends the active game early and records its result.
        requestId: { type: string }
        revision: { type: integer }
        settings: { $ref: "#/components/schemas/Settings" }
        ready: { type: boolean }
        text: { type: string, maxLength: 4000 }
        deityId: { type: string }
        aiBudget: { type: integer, minimum: 0, maximum: 500000 }
        aiAgentId: { type: string }
    Settings:
      type: object
      required: [language, objectType, intMin, intMax, stringMaxLength, grammarId, utilitySelectorId, complexityFunctionId, spawnFunctionId, planningSeconds, halfLifeSeconds, startingObjectCount, spawnRateHz, interactionRateHz, interactionComputeMs, pauseSeconds, startingEnergy, energyPerSecond]
      properties:
        language: { type: string, enum: [python, typescript] }
        objectType: { type: string, enum: [Int, string] }
        intMin: { type: integer }
        intMax: { type: integer }
        stringMaxLength: { type: integer }
        grammarId: { type: string }
        utilitySelectorId: { type: string }
        complexityFunctionId: { type: string }
        spawnFunctionId: { type: string, enum: [uniform] }
        planningSeconds: { type: number }
        halfLifeSeconds: { type: number }
        startingObjectCount: { type: integer }
        spawnRateHz: { type: number }
        interactionRateHz: { type: number, minimum: 0, maximum: 1000, default: 100 }
        interactionComputeMs:
          description: Guest execution CPU budget per interaction in milliseconds; excludes compilation and worker startup. Configurable only between games.
          type: integer
          minimum: 1
          maximum: 1000
          default: 5
        pauseSeconds: { type: number }
        startingEnergy: { type: number }
        energyPerSecond: { type: number }
    RoomSummary:
      type: object
      required: [id, shortCode, ownerId, ownerName, createdAt, memberCount, phase, activeGameShortCode]
      properties:
        id: { type: string }
        shortCode: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        createdAt:
          description: Unix milliseconds; null for legacy rooms whose creation time was not recorded.
          oneOf:
            - { type: number }
            - { type: "null" }
        memberCount: { type: integer }
        phase:
          type: string
          description: "`lobby` between games, otherwise the active game's phase."
        activeGameShortCode: { type: [string, "null"] }
    Member:
      type: object
      required: [id, name, kind, ready]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [human, ai] }
        ready: { type: boolean }
        status: { type: string }
    ChatMessage:
      type: object
      required: [id, authorId, authorName, kind, text, timestamp]
      properties:
        id: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        kind: { type: string }
        text: { type: string }
        timestamp: { type: number }
    PublicObject:
      type: object
      required: [id, value, version, totalUtility]
      properties:
        id: { type: string }
        value:
          oneOf:
            - { type: integer }
            - { type: string }
        version: { type: integer }
        totalUtility:
          type: number
          description: Sum of every god's utility for this object.
    Standing:
      type: object
      required: [deityId, name, kind, totalScore, rank]
      properties:
        deityId: { type: string }
        name: { type: string }
        kind: { type: string }
        totalScore: { type: number }
        rank: { type: integer }
    GameLink:
      type: object
      required: [id, shortCode, roomShortCode, status]
      properties:
        id: { type: string }
        shortCode: { type: string }
        roomShortCode: { type: [string, "null"] }
        status: { type: string, enum: [current, historical, unavailable] }
    RosterEntry:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [human, ai] }
    Winner:
      type: object
      required: [deityId, name, kind]
      properties:
        deityId: { type: string }
        name: { type: string }
        kind: { type: string }
    ActiveGameRef:
      type: object
      description: The room's single active (not yet ended) game.
      required: [id, shortCode, phase, startedAt, roster]
      properties:
        id: { type: string }
        shortCode: { type: string }
        phase: { type: string }
        startedAt: { type: number }
        roster: { type: array, items: { $ref: "#/components/schemas/RosterEntry" } }
    GameRecord:
      type: object
      description: Public result of one finished game, kept in its room's history.
      required: [id, shortCode, roomId, startedAt, endedAt, endReason, settings, roster, leaderboard, winners, worldSeconds, objectCount, agentCount]
      properties:
        id: { type: string }
        shortCode: { type: string }
        roomId: { type: string }
        startedAt: { type: number }
        endedAt:
          description: Unix milliseconds; null for legacy games whose end time was not recorded.
          type: [number, "null"]
        endReason:
          type: [string, "null"]
          enum: [lifetime, owner, retired, null]
        settings: { $ref: "#/components/schemas/Settings" }
        roster: { type: array, items: { $ref: "#/components/schemas/RosterEntry" } }
        leaderboard: { type: array, items: { $ref: "#/components/schemas/Standing" } }
        winners:
          description: Every god ranked first (ties share the win).
          type: array
          items: { $ref: "#/components/schemas/Winner" }
        worldSeconds: { type: number }
        objectCount: { type: integer }
        agentCount: { type: integer }
    GameView:
      description: A game's own page. Public information only.
      allOf:
        - $ref: "#/components/schemas/PublicGame"
        - type: object
          required: [roomId, roomShortCode, ownerId, status, winners, chat, roomActiveGame, utilityCatalog, serverTime, startedAt, endedAt, endReason, recoveryReason, settings, roster]
          properties:
            roomId: { type: [string, "null"] }
            roomShortCode: { type: [string, "null"] }
            ownerId: { type: [string, "null"] }
            status: { type: string, enum: [active, ended] }
            winners: { type: array, items: { $ref: "#/components/schemas/Winner" } }
            chat:
              description: Public room chat sent while this game was played (most recent 100).
              type: array
              items: { $ref: "#/components/schemas/ChatMessage" }
            roomActiveGame:
              description: The room's active game now, which may be a newer one.
              oneOf:
                - { $ref: "#/components/schemas/ActiveGameRef" }
                - { type: "null" }
            utilityCatalog: { type: array, items: { $ref: "#/components/schemas/UtilityFamily" } }
            serverTime: { type: number }
    PublicGame:
      type: object
      required: [id, shortCode, phase, worldSeconds, planningEndsAt, pauseEndsAt, objects, leaderboard, agentCount]
      properties:
        id: { type: string }
        shortCode: { type: string }
        phase: { type: string }
        worldSeconds: { type: number }
        planningEndsAt: { type: number }
        pauseEndsAt: { type: number }
        agentCount: { type: integer }
        objects: { type: array, items: { $ref: "#/components/schemas/PublicObject" } }
        leaderboard: { type: array, items: { $ref: "#/components/schemas/Standing" } }
        startedAt: { type: number }
        endedAt: { type: [number, "null"] }
        endReason: { type: [string, "null"] }
        recoveryReason: { type: [string, "null"] }
        settings: { $ref: "#/components/schemas/Settings" }
        roster: { type: array, items: { $ref: "#/components/schemas/RosterEntry" } }
    RoomState:
      type: object
      description: >-
        A room is a persistent lobby: members, readiness and the owner's settings for the NEXT game.
        Each launched game has its own page (GET /games/{code}/state) and, once ended, an entry in
        GET /rooms/{roomId}/games.
      required: [id, shortCode, ownerId, ownerName, createdAt, revision, settings, members, chat, game, activeGame, serverTime, utilityCatalog, aiBudget, aiUsed]
      properties:
        id: { type: string }
        shortCode: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        createdAt:
          description: Unix milliseconds; null for legacy rooms whose creation time was not recorded.
          type: [number, "null"]
        revision: { type: integer }
        settings:
          description: Settings for the next game. Each game keeps its own snapshot from launch.
          allOf: [{ $ref: "#/components/schemas/Settings" }]
        members: { type: array, items: { $ref: "#/components/schemas/Member" } }
        chat: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
        activeGame:
          oneOf:
            - { $ref: "#/components/schemas/ActiveGameRef" }
            - { type: "null" }
        game:
          description: >-
            Deprecated legacy view of the room's current game slot (the active game, or the most recent
            one until the next launch). New clients use activeGame, GET /games/{code}/state and the history.
          oneOf:
            - { $ref: "#/components/schemas/PublicGame" }
            - { type: "null" }
        serverTime: { type: number }
        utilityCatalog:
          type: array
          description: Public list of utility-function families gods may have drawn for this object type.
          items: { $ref: "#/components/schemas/UtilityFamily" }
        aiBudget: { type: integer }
        aiUsed: { type: integer }
    UtilityFamily:
      type: object
      required: [id, name, theme]
      properties:
        id: { type: string }
        name: { type: string }
        theme: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

