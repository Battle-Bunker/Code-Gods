kind = "web"
previewPath = "/player/"
title = "Code Gods · Player"
description = "Customizable player client for Code Gods: connects to the Convex engine with a room credential held in Replit Secrets."
version = "1.0.0"
id = "artifacts/player-web"
router = "path"

[[services]]
name = "web"
paths = [ "/player/" ]
localPort = 22772

[services.development]
run = "pnpm --filter @workspace/player-web run dev"

[services.env]
PORT = "22772"
BASE_PATH = "/player/"
